<script>
// La coquille du site: this page opened on its own (not in a frame, over http) keeps the whole site in a frame
// (?<page>#… in the address: that page, else the home) and stays open from page to page (see the end of the page)
window.COQ_SHELL=window.top===window&&/^https?:$/.test(location.protocol)&&!/[?&]solo(&|$)/.test(location.search)?'site':null;
if(window.COQ_SHELL)document.documentElement.classList.add('coqsite');
</script>

<style>
:root{--bg:#e2edf4;--ink:#14222e;--muted:#55687a;--line:#c9dbe7;--panel:#f2f8fb;--accent:#1d6fa8;--warn:#fff4e5;--warn-line:#e8c48a;--err:#b3261e}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0e1a24;--ink:#e4eef5;--muted:#93a8b9;--line:#24384a;--panel:#15232f;--accent:#5cb6e6;--warn:#2a2116;--warn-line:#6b5530;--err:#f08a80}}
:root[data-theme="dark"]{--bg:#0e1a24;--ink:#e4eef5;--muted:#93a8b9;--line:#24384a;--panel:#15232f;--accent:#5cb6e6;--warn:#2a2116;--warn-line:#6b5530;--err:#f08a80}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,sans-serif;line-height:1.5}
main{max-width:64rem;margin:0 auto;padding:8vh max(16px,env(safe-area-inset-right,0px)) max(48px,env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}

.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:visible;flex:none;margin-top:6px}
.seg button{font:inherit;font-size:.8rem;font-weight:600;border:0;background:transparent;color:var(--muted);padding:6px 10px;cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.seg .themeBtn{border-right:1px solid var(--line);min-width:2.4em;border-radius:7px 0 0 7px}
/* language: one frame with the current code, a menu drops from it */
.langdd{position:relative;display:inline-flex}
.langBtn{border-radius:0 7px 7px 0}.langBtn::after{content:'▾';margin-left:.3em;opacity:.65}
.langdd .menu{position:absolute;right:-1px;top:calc(100% + 5px);display:flex;flex-direction:column;min-width:8.5em;background:var(--panel);border:1px solid var(--line);border-radius:8px;overflow:hidden;box-shadow:0 6px 20px rgb(0 0 0/.18);z-index:30}
.langdd .menu[hidden]{display:none}
.langdd .menu button{text-align:left;padding:8px 14px;font-size:.85rem;font-weight:500;color:var(--ink);background:transparent;border:0;border-radius:0}
.langdd .menu button:hover{background:var(--line)}
.langdd .menu button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
/* game cards: common/cards.css; here their grid */
.cards{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(auto-fill,minmax(17rem,1fr));gap:14px}
/* phone: every card on two columns, smaller titles (Ponte and Diagonal Blocks are long) */
@media (max-width:560px){.cards{grid-template-columns:1fr 1fr;gap:10px}.cards .gc{border-radius:10px}}
details.how{margin:0 0 24px;border:1px solid var(--line);border-radius:12px;background:var(--panel);padding:10px 16px;max-width:42rem}
details.how summary{cursor:pointer;font-weight:600}
details.how ul{margin:.6em 0 .2em;padding-left:1.2em}
details.how li{margin:.35em 0}
/* a code received (or a whole link): straight to its game, as a player or a spectator (common/codes.js); a Mochalunt link to mochalunt.html */
.code{display:flex;flex-wrap:wrap;align-items:center;gap:8px;margin:0 0 12px;max-width:42rem}
.code label{font-weight:600;font-size:.95rem}
.code input{font:inherit;font-size:.95rem;color:var(--ink);background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:7px 10px;width:9.5em;min-width:0;letter-spacing:.04em}
.code button{font:inherit;font-size:.9rem;font-weight:600;color:var(--bg);background:var(--ink);border:1px solid var(--ink);border-radius:8px;padding:7px 14px;cursor:pointer}
.code .err{flex-basis:100%;margin:0;font-size:.88rem;color:var(--err)}
/* Mochalunt: one line, one link, under the games (decision of 15.11.2026); the foot: « Signaler un défaut » */
.mline{margin:18px 0 0;color:var(--muted)}.mline a{color:var(--ink);font-weight:650}.mline a:hover{color:var(--accent)}
footer{margin-top:32px;font-size:.85rem}footer a{color:var(--muted)}footer a:hover{color:var(--accent)}
details.how .warn{margin:.8em 0 .3em;padding:8px 12px;border:1px solid var(--warn-line);background:var(--warn);border-radius:8px}
.coqsite body{overflow:hidden}.coqsite main{display:none}
#coqW{position:fixed;inset:0;padding:env(safe-area-inset-top,0px) env(safe-area-inset-right,0px) env(safe-area-inset-bottom,0px) env(safe-area-inset-left,0px);background:var(--bg)}
#coqW iframe{display:block;width:100%;height:100%;border:0}
/* the call, when the page in the frame does not show it (common/coquille.js) */
.vpill{position:fixed;z-index:60;left:50%;bottom:max(16px,env(safe-area-inset-bottom,0px));transform:translateX(-50%);display:flex;align-items:center;gap:8px;max-width:calc(100% - 32px);
  background:var(--panel);color:var(--ink);border:1px solid var(--line);border-radius:999px;padding:6px 6px 6px 14px;box-shadow:0 6px 20px rgb(0 0 0/.18);font:.9rem system-ui,-apple-system,sans-serif}

.vpill button{flex:none;font:inherit;font-size:.85rem;color:var(--ink);background:var(--panel);border:1px solid var(--line);border-radius:999px;padding:5px 12px;cursor:pointer}
.vpill button.primary{background:var(--ink);color:var(--bg);border-color:var(--ink);font-weight:600}.vpill button[hidden]{display:none}

<script>
// ---------- La coquille du site ----------
// The page in the frame changes as usual (links, its own scripts): each change is an entry of the browser's history,
// so Back and Forward go from page to page inside the frame while this page stays; the address follows the frame
// (./?volo#host-…, ./ for the home), and a reload or a copied address opens the same page. What this page keeps from
// page to page (common/coquille.js): the voice between the two players of a game by link (its own link, ids
// coq-<code>-<seat>, from the table the page tells: common/core.js « La coquille »), shown in the page's voice box,
// or in a bar at the bottom when the page in the frame does not show it.
if(window.COQ_SHELL==='site'){(()=>{
  const dir=location.pathname.replace(/[^/]*$/,''),m=/^\?([a-z0-9][a-z0-9-]*)/.exec(location.search),pg=m&&m[1]!=='solo'?m[1]:null;
  const w=document.createElement('div');w.id='coqW';const f=document.createElement('iframe');f.allow='microphone; clipboard-write; autoplay; fullscreen';
  f.src=pg?pg+'.html'+location.hash:'index.html';w.appendChild(f);document.body.appendChild(w);
  function sync(){let L;try{L=f.contentWindow.location;if(!L||L.protocol==='about:')return;}catch(e){return;}
    if(L.origin!==location.origin)return;const file=L.pathname.split('/').pop()||'index.html';
    const url=file==='index.html'&&!L.hash?dir:dir+'?'+file.replace(/\.html$/,'')+L.hash;   // (the frame's own query is not kept)
    if(url!==location.pathname+location.search+location.hash)try{history.replaceState(null,'',url);}catch(e){}
    try{const tt=f.contentDocument.title;if(tt&&document.title!==tt)document.title=tt;}catch(e){}}
  // the frame's surroundings (a phone's safe area) in the page's own background
  const bg=()=>{try{w.style.background=getComputedStyle(f.contentDocument.body).backgroundColor;}catch(e){}};
  let vbox=false,other='',want=null;
  f.addEventListener('load',()=>{vbox=false;sync();bg();COQ.push();});setInterval(sync,250);
  // an address typed or pasted that differs only after the # (the same page): no reload of this page, so the frame goes there
  addEventListener('hashchange',()=>{const q=/^\?([a-z0-9][a-z0-9-]*)/.exec(location.search),p=q&&q[1]!=='solo'?q[1]:null;
    try{f.contentWindow.location.replace((p?p+'.html':'index.html')+location.hash);}catch(e){f.src=(p?p+'.html':'index.html')+location.hash;}});
  addEventListener('storage',e=>{if(e.key==='games-theme')setTimeout(bg,80);});
  COQ.frame=()=>f;COQ.covered=()=>vbox;COQ.others=()=>other||COQ.t('opp');
  const link=()=>{if(want&&typeof Peer!=='undefined')COQ.linkStart(want);};
  addEventListener('message',e=>{if(e.source!==f.contentWindow||!e.data||e.data.coq!==1)return;const d=e.data;
    if(d.t==='table'){vbox=!!d.vbox;if(d.other)other=String(d.other).slice(0,24);
      if(typeof d.code==='string'&&/^[a-z0-9]{4,16}$/.test(d.code)&&(d.seat===0||d.seat===1)){want={me:'coq-'+d.code+'-'+d.seat,other:'coq-'+d.code+'-'+(1-d.seat),dial:d.seat===1,rec:'coquille-'+d.code};link();}
      COQ.push();}
    else if(d.t==='voice')COQ.op(d.op,d.v);});
  // PeerJS, for the link (the home page itself does without it)
  if(typeof Peer==='undefined'){const s=document.createElement('script');s.src='https://cdnjs.cloudflare.com/ajax/libs/peerjs/1.5.4/peerjs.min.js';s.onload=link;
    s.onerror=()=>{const u=document.createElement('script');u.src='https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js';u.onload=link;document.head.appendChild(u);};document.head.appendChild(s);}})();}
</script>
