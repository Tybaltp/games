<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Jeux</title>
<script src="common/theme.js?v=2"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="common/cards.css?v=2">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,800&display=swap">
<style>
:root{--bg:#f2f0ec;--ink:#1d1c1a;--muted:#6b6862;--line:#e3dfd6;--panel:#f9f8f5;--accent:#9C2E3A;--warn:#fff4e5;--warn-line:#e8c48a}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#11100f;--ink:#eeeae2;--muted:#a19d95;--line:#2f2d2a;--panel:#181715;--accent:#E1737D;--warn:#2a2116;--warn-line:#6b5530}}
:root[data-theme="dark"]{--bg:#11100f;--ink:#eeeae2;--muted:#a19d95;--line:#2f2d2a;--panel:#181715;--accent:#E1737D;--warn:#2a2116;--warn-line:#6b5530}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,sans-serif;line-height:1.5}
main{max-width:64rem;margin:0 auto;padding:8vh 16px 48px}
header{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
h1{font-size:1.8rem;margin:0 0 4px}
.lede{color:var(--muted);margin:0 0 20px;max-width:42rem}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden;flex:none;margin-top:6px}
.seg button{font:inherit;font-size:.8rem;font-weight:600;border:0;background:transparent;color:var(--muted);padding:6px 10px;cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.seg .themeBtn{border-right:1px solid var(--line);min-width:2.4em}
/* game cards: common/cards.css; here their grid */
.cards{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(auto-fill,minmax(17rem,1fr));gap:14px}
details.how{margin:0 0 24px;border:1px solid var(--line);border-radius:12px;background:var(--panel);padding:10px 16px;max-width:42rem}
details.how summary{cursor:pointer;font-weight:600}
details.how ul{margin:.6em 0 .2em;padding-left:1.2em}
details.how li{margin:.35em 0}
/* a code received: straight to its game, as a player (6 characters) or a spectator (8) */
.code{display:flex;flex-wrap:wrap;align-items:center;gap:8px;margin:0 0 12px;max-width:42rem}
.code label{font-weight:600;font-size:.95rem}
.code input{font:inherit;font-size:.95rem;color:var(--ink);background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:7px 10px;width:9.5em;min-width:0;letter-spacing:.04em}
.code button{font:inherit;font-size:.9rem;font-weight:600;color:var(--bg);background:var(--ink);border:1px solid var(--ink);border-radius:8px;padding:7px 14px;cursor:pointer}
.code .err{flex-basis:100%;margin:0;font-size:.88rem;color:var(--accent)}
details.how .warn{margin:.8em 0 .3em;padding:8px 12px;border:1px solid var(--warn-line);background:var(--warn);border-radius:8px}
</style>
</head>
<body>
<main>
<header><div><h1 data-i18n="title">Jeux</h1><p class="lede" data-i18n="lede"></p></div>
<div class="seg" role="group" aria-label="Langue / Language"><button type="button" data-lang="fr">FR</button><button type="button" data-lang="en">EN</button></div></header>
<form class="code" id="codeForm"><label for="codeIn" data-i18n="codeL"></label><input id="codeIn" autocomplete="off" spellcheck="false" autocapitalize="off" placeholder="k7m2qp"><button type="submit" data-i18n="codeGo"></button><p class="err" id="codeErr" hidden></p></form>
<details class="how"><summary data-i18n="howT"></summary>
  <ul>
    <li data-i18n-html="how0"></li>
    <li data-i18n-html="how1"></li>
    <li data-i18n-html="how2"></li>
    <li data-i18n-html="how3"></li>
    <li data-i18n-html="how4"></li>
  </ul>
  <p class="warn" data-i18n-html="warn"></p>
</details>
<ul class="cards">
<li><a class="gc c-pente" href="pente.html"><span class="ct">Pente</span><span class="bar"></span><span class="art"></span></a></li>
<li><a class="gc c-ponte" href="pontedeldiavolo.html"><span class="ct">Ponte <em>del</em> Diavolo</span><span class="bar"></span><span class="art"></span></a></li>
<li><a class="gc c-zertz" href="zertz.html"><span class="ct">Zèrtz</span><span class="bar"></span><span class="art"></span></a></li>
<li><a class="gc c-volo" href="volo.html"><span class="ct">Volo</span><span class="bar"></span><span class="art"></span></a></li>
<li><a class="gc c-arimaa" href="arimaa.html"><span class="ct">Arimaa</span><span class="bar"></span><span class="art"></span></a></li>
<li><a class="gc c-gyges" href="gyges.html"><span class="ct">Gygès</span><span class="bar"></span><span class="art"></span></a></li>
<li><a class="gc c-tintas" href="tintas.html"><span class="ct">Tintas</span><span class="bar"></span><span class="art"></span></a></li>
<li><a class="gc c-dblocks" href="diagonalblocks.html"><span class="ct">Diagonal Blocks</span><span class="bar"></span><span class="art"></span></a></li>
<li><a class="gc c-quarto" href="quarto.html"><span class="ct">Quarto</span><span class="bar"></span><span class="art"></span></a></li>
</ul>
</main>
<script src="common/codes.js?v=2"></script>
<script>
const I18N={
 fr:{title:"Jeux",lede:"Jeux de plateau à deux, de navigateur à navigateur. Créez une partie, envoyez le code, jouez.",
     codeL:"Vous avez reçu un code ?",codeGo:"Rejoindre",codeBad:"Ce code ne correspond à aucune partie.",
     howT:"Comment ça marche ?",
     how0:"<b>Quatre façons de jouer.</b> Inviter quelqu'un par un lien, affronter l'ordinateur (Diagonal Blocks Duo, Gygès, Pente, Ponte del Diavolo, Quarto, Tintas, Volo, Zèrtz), jouer face à face sur le même appareil, ou en mode libre pour essayer et analyser, avec annulation et suggestions.",
     how1:"<b>Pas d'hébergement.</b> Il n'y a pas de serveur de jeu : la partie tourne dans le navigateur de celui qui la crée. Un service public (PeerJS) sert seulement à mettre les deux navigateurs en relation grâce au code.",
     how2:"<b>De navigateur à navigateur.</b> Les coups passent d'un joueur à l'autre directement, ou par un relais quand le réseau l'impose. Rien n'est enregistré ailleurs que dans vos deux navigateurs. Les observateurs se connectent de la même façon.",
     how3:"<b>Robuste aux déconnexions.</b> Chaque joueur garde la position. Si l'hôte disparaît, l'invité reprend l'hébergement sous le même code après une dizaine de secondes. Les pendules s'arrêtent quand c'est au tour du joueur absent, et reprennent à son retour.",
     how4:"<b>En dernier recours</b>, un code de reprise, copié pendant la partie, permet de la relancer depuis la page d'accueil du jeu.",
     warn:"<b>Important :</b> ne fermez pas l'onglet et ne quittez pas le navigateur pendant une partie. C'est votre navigateur qui la fait vivre. Sur téléphone, évitez de rester longtemps dans une autre application."},
 en:{title:"Games",lede:"Two-player board games, straight from browser to browser. Create a game, send the code, play.",
     codeL:"Received a code?",codeGo:"Join",codeBad:"This code matches no game.",
     howT:"How does it work?",
     how0:"<b>Four ways to play.</b> Invite someone with a link, play the computer (Diagonal Blocks Duo, Gygès, Pente, Ponte del Diavolo, Quarto, Tintas, Volo, Zèrtz), play face to face on the same device, or in free mode to try things and analyse, with undo and hints.",
     how1:"<b>No hosting.</b> There is no game server: the game runs in the browser of whoever creates it. A public service (PeerJS) is only used to put the two browsers in touch through the code.",
     how2:"<b>Browser to browser.</b> Moves go from one player to the other directly, or through a relay when the network requires it. Nothing is stored anywhere but in your two browsers. Spectators connect the same way.",
     how3:"<b>Robust to disconnections.</b> Each player keeps the position. If the host drops out, the guest takes over hosting under the same code after about ten seconds. The clocks stop when it is the absent player's turn, and resume when they are back.",
     how4:"<b>As a last resort</b>, a resume code, copied during the game, lets you restart it from the game's home page.",
     warn:"<b>Important:</b> do not close the tab or quit the browser during a game. Your browser is what keeps it alive. On a phone, avoid staying in another app for long."}};
let lang=(()=>{try{return JSON.parse(localStorage.getItem('games-lang'))||JSON.parse(localStorage.getItem('volo-lang'));}catch(e){return null;}})()||((navigator.language||'fr').toLowerCase().startsWith('fr')?'fr':'en');
function apply(){document.documentElement.lang=lang;document.title=I18N[lang].title;
  document.querySelectorAll('[data-i18n]').forEach(e=>e.textContent=I18N[lang][e.dataset.i18n]);
  document.querySelectorAll('[data-i18n-html]').forEach(e=>e.innerHTML=I18N[lang][e.dataset.i18nHtml]);
  document.querySelectorAll('[data-lang]').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.lang===lang)));}
document.querySelectorAll('[data-lang]').forEach(b=>b.onclick=()=>{lang=b.dataset.lang;try{localStorage.setItem('games-lang',JSON.stringify(lang));localStorage.setItem('volo-lang',JSON.stringify(lang));localStorage.setItem('pente-lang',lang);}catch(e){}apply();});
apply();
// a code (or a whole invitation link): to its game's page, which connects at once (common/codes.js)
document.getElementById('codeForm').onsubmit=e=>{e.preventDefault();const v=document.getElementById('codeIn').value,to=codeTarget(v),er=document.getElementById('codeErr');
  er.hidden=!!to||!v.trim();er.textContent=I18N[lang].codeBad;if(to)location.href=to;};
</script>
</body>
</html>
