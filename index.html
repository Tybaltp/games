<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Jeux</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,800&display=swap">
<style>
:root{--bg:#f2f0ec;--ink:#1d1c1a;--muted:#6b6862;--line:#e3dfd6;--panel:#f9f8f5;--accent:#9C2E3A;--warn:#fff4e5;--warn-line:#e8c48a}
@media (prefers-color-scheme:dark){:root{--bg:#11100f;--ink:#eeeae2;--muted:#a19d95;--line:#2f2d2a;--panel:#181715;--accent:#E1737D;--warn:#2a2116;--warn-line:#6b5530}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,sans-serif;line-height:1.5}
main{max-width:64rem;margin:0 auto;padding:8vh 16px 48px}
header{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
h1{font-size:1.8rem;margin:0 0 4px}
.lede{color:var(--muted);margin:0 0 20px;max-width:42rem}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden;flex:none;margin-top:6px}
.seg button{font:inherit;font-size:.8rem;font-weight:600;border:0;background:transparent;color:var(--muted);padding:6px 10px;cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
/* game cards: the game's name top left, a piece of its board bottom right behind an oblique cut underlined in the
   game's accent; each card takes the game page's tint, ink and accent (dark: its panel tint); images in img/cartes/ */
.cards{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(auto-fill,minmax(17rem,1fr));gap:14px}
.card{position:relative;display:block;aspect-ratio:16/10;border-radius:14px;overflow:hidden;background:var(--gbg);color:var(--gink);text-decoration:none;isolation:isolate}
.card .ct{position:absolute;left:18px;top:14px;z-index:3;max-width:50%;font-family:"Bricolage Grotesque",system-ui,sans-serif;font-weight:800;font-size:2.15rem;line-height:1.05;letter-spacing:-.01em;transition:color .2s}
.card .ct em{font-style:italic}
.c-ponte .ct{font-size:1.9rem}
.card:hover .ct,.card:focus-visible .ct{color:var(--gacc)}
.card:focus-visible{outline:2px solid var(--gacc);outline-offset:3px}
/* the image fills the right 76 % exactly (it has that box's proportions); cut from 52 % at the top to the box's left edge
   at the bottom, with a 6 px bar in the accent along the cut */
.card .art,.card .bar{position:absolute;right:0;top:0;bottom:0;width:76%}
.card .art{background:var(--img) center/cover no-repeat;clip-path:polygon(calc(52% + 6px) 0,100% 0,100% 100%,6px 100%)}
.card .bar{background:var(--gacc);clip-path:polygon(52% 0,calc(52% + 6px) 0,6px 100%,0 100%)}
.c-pente{--gbg:#f0e1e1;--gink:#1B211F;--gacc:#9C2E3A;--img:url(img/cartes/pente.svg)}
.c-ponte{--gbg:#ece4d9;--gink:#1d2729;--gacc:#a8761c;--img:url(img/cartes/ponte.svg)}
.c-zertz{--gbg:#e5f1f4;--gink:#1c282d;--gacc:#5b8792;--img:url(img/cartes/zertz.svg)}
.c-volo{--gbg:#e9eff7;--gink:#1c282d;--gacc:#2f6fd6;--img:url(img/cartes/volo.svg)}
.c-arimaa{--gbg:#e5f1f4;--gink:#26231d;--gacc:#2f7d8c;--img:url(img/cartes/arimaa.svg)}
.c-gyges{--gbg:#ede4d9;--gink:#26231d;--gacc:#d98f1f;--img:url(img/cartes/gyges.svg)}
.c-tintas{--gbg:#e8e2ee;--gink:#1d2629;--gacc:#6a3790;--img:url(img/cartes/tintas.svg)}
.c-dblocks{--gbg:#f0e1e5;--gink:#22231f;--gacc:#9c2457;--img:url(img/cartes/dblocks.svg)}
.c-quarto{--gbg:#d9e2ce;--gink:#26231d;--gacc:#6f8f66;--img:url(img/cartes/quarto.svg)}
@media (prefers-color-scheme:dark){.c-pente{--gbg:#251b1b;--gink:#E5EAE6;--gacc:#b8434f;--img:url(img/cartes/pente-dark.svg)}.c-ponte{--gbg:#29241c;--gink:#e3e8e6;--gacc:#e0a94a;--img:url(img/cartes/ponte-dark.svg)}.c-zertz{--gbg:#152023;--gink:#e2e9eb;--gacc:#5d8a98;--img:url(img/cartes/zertz-dark.svg)}.c-volo{--gbg:#1a1e26;--gink:#e2e9eb;--gacc:#6aa2f5;--img:url(img/cartes/volo-dark.svg)}.c-arimaa{--gbg:#201e19;--gink:#ebe6db;--gacc:#3f95a5;--img:url(img/cartes/arimaa-dark.svg)}.c-gyges{--gbg:#2d261f;--gink:#ebe5d8;--gacc:#efa93c;--img:url(img/cartes/gyges-dark.svg)}.c-tintas{--gbg:#201c24;--gink:#e2e9eb;--gacc:#a676d4;--img:url(img/cartes/tintas-dark.svg)}.c-dblocks{--gbg:#251b1e;--gink:#e6e8e3;--gacc:#d4588a;--img:url(img/cartes/dblocks-dark.svg)}.c-quarto{--gbg:#1d2f21;--gink:#ebe5d8;--gacc:#9cb894;--img:url(img/cartes/quarto-dark.svg)}}
details.how{margin:0 0 24px;border:1px solid var(--line);border-radius:12px;background:var(--panel);padding:10px 16px;max-width:42rem}
details.how summary{cursor:pointer;font-weight:600}
details.how ul{margin:.6em 0 .2em;padding-left:1.2em}
details.how li{margin:.35em 0}
details.how .warn{margin:.8em 0 .3em;padding:8px 12px;border:1px solid var(--warn-line);background:var(--warn);border-radius:8px}
</style>
</head>
<body>
<main>
<header><div><h1 data-i18n="title">Jeux</h1><p class="lede" data-i18n="lede"></p></div>
<div class="seg" role="group" aria-label="Langue / Language"><button type="button" data-lang="fr">FR</button><button type="button" data-lang="en">EN</button></div></header>
<details class="how"><summary data-i18n="howT"></summary>
  <ul>
    <li data-i18n-html="how0"></li>
    <li data-i18n-html="how1"></li>
    <li data-i18n-html="how2"></li>
    <li data-i18n-html="how3"></li>
    <li data-i18n-html="how4"></li>
  </ul>
  <p class="warn" data-i18n-html="warn"></p>
</details>
<ul class="cards">
<li><a class="card c-pente" href="pente.html"><span class="ct">Pente</span><span class="bar"></span><span class="art"></span></a></li>
<li><a class="card c-ponte" href="pontedeldiavolo.html"><span class="ct">Ponte <em>del</em> Diavolo</span><span class="bar"></span><span class="art"></span></a></li>
<li><a class="card c-zertz" href="zertz.html"><span class="ct">Zèrtz</span><span class="bar"></span><span class="art"></span></a></li>
<li><a class="card c-volo" href="volo.html"><span class="ct">Volo</span><span class="bar"></span><span class="art"></span></a></li>
<li><a class="card c-arimaa" href="arimaa.html"><span class="ct">Arimaa</span><span class="bar"></span><span class="art"></span></a></li>
<li><a class="card c-gyges" href="gyges.html"><span class="ct">Gygès</span><span class="bar"></span><span class="art"></span></a></li>
<li><a class="card c-tintas" href="tintas.html"><span class="ct">Tintas</span><span class="bar"></span><span class="art"></span></a></li>
<li><a class="card c-dblocks" href="diagonalblocks.html"><span class="ct">Diagonal Blocks</span><span class="bar"></span><span class="art"></span></a></li>
<li><a class="card c-quarto" href="quarto.html"><span class="ct">Quarto</span><span class="bar"></span><span class="art"></span></a></li>
</ul>
</main>
<script>
const I18N={
 fr:{tourT:"Tournois",mochalunt:"Un match entre deux joueurs sur les jeux de la ronde, une table par jeu, avec observateurs.",title:"Jeux",lede:"Jeux de plateau à deux, de navigateur à navigateur. Créez une partie, envoyez le code, jouez.",
     howT:"Comment ça marche ?",
     how0:"<b>Quatre façons de jouer.</b> Inviter quelqu'un par un lien, affronter l'ordinateur (Diagonal Blocks Duo, Gygès, Pente, Ponte del Diavolo, Quarto, Tintas, Volo, Zèrtz), jouer face à face sur le même appareil, ou en mode libre pour essayer et analyser, avec annulation et suggestions.",
     how1:"<b>Pas d'hébergement.</b> Il n'y a pas de serveur de jeu : la partie tourne dans le navigateur de celui qui la crée. Un service public (PeerJS) sert seulement à mettre les deux navigateurs en relation grâce au code.",
     how2:"<b>De navigateur à navigateur.</b> Les coups passent d'un joueur à l'autre directement, ou par un relais quand le réseau l'impose. Rien n'est enregistré ailleurs que dans vos deux navigateurs. Les spectateurs se connectent de la même façon.",
     how3:"<b>Robuste aux déconnexions.</b> Chaque joueur garde la position. Si l'hôte disparaît, l'invité reprend l'hébergement sous le même code après une dizaine de secondes. Les pendules s'arrêtent quand c'est au tour du joueur absent, et reprennent à son retour.",
     how4:"<b>En dernier recours</b>, un code de reprise, copié pendant la partie, permet de la relancer depuis la page d'accueil du jeu.",
     warn:"<b>Important :</b> ne fermez pas l'onglet et ne quittez pas le navigateur pendant une partie. C'est votre navigateur qui la fait vivre. Sur téléphone, évitez de rester longtemps dans une autre application.",
     pente:"Cinq alignés, ou cinq paires capturées. Ouverture Swap2.",ponte:"Bâtissez des îles de quatre tuiles et reliez-les par des ponts.",
     zertz:"Des billes communes sur un plateau d'anneaux qui rétrécit.",volo:"Réunissez tous vos oiseaux en une seule nuée.",
     arimaa:"Menez un lapin au bout du plateau : pousser, tirer, pièges.",gyges:"Des anneaux neutres qui rebondissent jusqu’au but adverse.",
     tintas:"Un pion commun, sept couleurs : collectionnez-en une.",dblocks:"Posez vos polyominos coin contre coin, couvrez le plus de cases.",
     quarto:"Donnez à l'adversaire la pièce qu'il posera ; alignez quatre pièces qui partagent une caractéristique."},
 en:{tourT:"Tournaments",mochalunt:"A match between two players over the round's games, one table per game, with spectators.",title:"Games",lede:"Two-player board games, straight from browser to browser. Create a game, send the code, play.",
     howT:"How does it work?",
     how0:"<b>Four ways to play.</b> Invite someone with a link, play the computer (Diagonal Blocks Duo, Gygès, Pente, Ponte del Diavolo, Quarto, Tintas, Volo, Zèrtz), play face to face on the same device, or in free mode to try things and analyse, with undo and hints.",
     how1:"<b>No hosting.</b> There is no game server: the game runs in the browser of whoever creates it. A public service (PeerJS) is only used to put the two browsers in touch through the code.",
     how2:"<b>Browser to browser.</b> Moves go from one player to the other directly, or through a relay when the network requires it. Nothing is stored anywhere but in your two browsers. Spectators connect the same way.",
     how3:"<b>Robust to disconnections.</b> Each player keeps the position. If the host drops out, the guest takes over hosting under the same code after about ten seconds. The clocks stop when it is the absent player's turn, and resume when they are back.",
     how4:"<b>As a last resort</b>, a resume code, copied during the game, lets you restart it from the game's home page.",
     warn:"<b>Important:</b> do not close the tab or quit the browser during a game. Your browser is what keeps it alive. On a phone, avoid staying in another app for long.",
     pente:"Five in a row, or capture five pairs. Swap2 opening.",ponte:"Build islands of four tiles and link them with bridges.",
     zertz:"Shared marbles on a shrinking board of rings.",volo:"Gather all your birds into a single flock.",
     arimaa:"Get a rabbit to the far side: push, pull, traps.",gyges:"Neutral rings bounce their way to the opponent’s goal.",
     tintas:"One shared pawn, seven colours: collect a full set.",dblocks:"Place your polyominoes corner to corner, cover the most squares.",
     quarto:"Give your opponent the piece they will place; line up four pieces sharing a trait."}};
let lang=(()=>{try{return JSON.parse(localStorage.getItem('games-lang'))||JSON.parse(localStorage.getItem('volo-lang'));}catch(e){return null;}})()||((navigator.language||'fr').toLowerCase().startsWith('fr')?'fr':'en');
function apply(){document.documentElement.lang=lang;document.title=I18N[lang].title;
  document.querySelectorAll('[data-i18n]').forEach(e=>e.textContent=I18N[lang][e.dataset.i18n]);
  document.querySelectorAll('[data-i18n-html]').forEach(e=>e.innerHTML=I18N[lang][e.dataset.i18nHtml]);
  document.querySelectorAll('[data-lang]').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.lang===lang)));}
document.querySelectorAll('[data-lang]').forEach(b=>b.onclick=()=>{lang=b.dataset.lang;try{localStorage.setItem('games-lang',JSON.stringify(lang));localStorage.setItem('volo-lang',JSON.stringify(lang));localStorage.setItem('pente-lang',lang);}catch(e){}apply();});
apply();
</script>
</body>
</html>
