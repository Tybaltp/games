<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Pente</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Gloock&family=Figtree:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* Plateau à gauche, feuille de partie à droite ; tout s'empile sur téléphone */
:root{
 --bg:#E7EAE5; --surface:#F5F6F2; --ink:#1B211F; --muted:#5B6660; --rule:#CBD2CB;
 --accent:#9C2E3A; --accent-ink:#FFFFFF; --ok:#2F7D4F; --warn:#A86A12; --bad:#B3261E;
 --ring-b:transparent; --ring-w:rgba(0,0,0,.55);
 --f-display:"Gloock", Georgia, "Times New Roman", serif;
 --f-ui:"Figtree", system-ui, -apple-system, "Segoe UI", sans-serif;
 color-scheme:light;
}
@media (prefers-color-scheme:dark){:root{
 --bg:#141917; --surface:#1C2320; --ink:#E5EAE6; --muted:#98A39D; --rule:#2D3632;
 --accent:#E1737D; --accent-ink:#1A0C0E; --ok:#6CC08E; --warn:#E0A84A; --bad:#F2867D;
 --ring-b:rgba(255,255,255,.6); --ring-w:transparent; color-scheme:dark}}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--f-ui);font-size:15px;line-height:1.45}
[hidden]{display:none!important}
.gutter{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.topbar{max-width:1200px;margin:0 auto;padding-block:12px 0;display:flex;justify-content:flex-end;align-items:center;gap:10px}
.seg{display:inline-flex;border:1px solid var(--rule);border-radius:7px;overflow:hidden}
.seg button{font:inherit;font-size:12.5px;font-weight:700;letter-spacing:.04em;padding:5px 10px;border:0;background:var(--surface);color:var(--muted);cursor:pointer}
.seg button+button{border-left:1px solid var(--rule)}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.small{font:inherit;font-size:13px;font-weight:600;padding:5px 10px;border-radius:7px;border:1px solid var(--rule);background:var(--surface);color:var(--ink);cursor:pointer}
.small.armed{border-color:var(--bad);color:var(--bad)}
.app{max-width:1200px;margin:0 auto;padding-block:12px 32px;display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:28px;align-items:start}
.board-col{min-width:0}
.board-wrap{width:100%;max-width:min(100%,calc(100vh - 80px));margin:0 auto;aspect-ratio:1;border-radius:6px;overflow:hidden;box-shadow:0 1px 0 rgba(0,0,0,.08),0 14px 34px -18px rgba(40,25,10,.55)}
canvas{display:block;width:100%;height:100%;touch-action:manipulation}
.side{display:flex;flex-direction:column;gap:16px;min-width:0}
h1{font-family:var(--f-display);font-weight:400;font-size:42px;line-height:1;margin:0}
.head{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;flex-wrap:wrap}
.net{font-size:12.5px;font-weight:600;display:flex;align-items:center;gap:6px;color:var(--muted)}
.net i{width:8px;height:8px;border-radius:50%;background:var(--muted)}
.net.ok i{background:var(--ok)}.net.warn i{background:var(--warn)}.net.bad i{background:var(--bad)}
.tags{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.tag{font-size:11.5px;font-weight:600;letter-spacing:.04em;text-transform:uppercase;padding:3px 8px;border:1px solid var(--rule);border-radius:999px;color:var(--muted)}
.status{background:var(--surface);border:1px solid var(--rule);border-radius:8px;padding:14px 16px}
.status .main{font-size:18px;font-weight:600;display:flex;align-items:center;gap:10px}
.status.mine{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent)}
.status .sub{color:var(--muted);font-size:13.5px;margin-top:4px;min-height:1.2em}
.dot{width:9px;height:9px;border-radius:50%;background:var(--accent);flex:none;display:none}
.thinking .dot{display:block;animation:pulse 1s ease-in-out infinite}
@keyframes pulse{50%{opacity:.25}}
.players{display:grid}
.player{display:grid;grid-template-columns:22px minmax(0,1fr) auto;align-items:center;gap:10px;padding:10px 2px;border-bottom:1px solid var(--rule)}
.player:last-child{border-bottom:0}
.pstone{width:20px;height:20px;border-radius:50%;flex:none}
.pstone.b{background:radial-gradient(circle at 35% 30%,#5d625f,#0f1110 70%);box-shadow:0 0 0 1px var(--ring-b)}
.pstone.w{background:radial-gradient(circle at 35% 30%,#fff,#d2d0c8 75%);box-shadow:0 0 0 1px var(--ring-w)}
.pstone.u{border:1.5px dashed var(--muted)}
.pname{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pname small{font-weight:400;color:var(--muted)}
.slots{display:flex;gap:3px;margin-top:4px}
.slot{width:20px;height:12px;border-radius:7px;border:1px dashed var(--rule);display:flex;align-items:center;justify-content:center;gap:1px}
.slot.on{border-style:solid;border-color:var(--muted)}
.mini{width:6px;height:6px;border-radius:50%;display:inline-block;flex:none}
.mini.b{background:#151716;box-shadow:0 0 0 1px var(--ring-b)}.mini.w{background:#f4f3ee;box-shadow:0 0 0 1px var(--ring-w)}
.clock{font-variant-numeric:tabular-nums;font-size:24px;font-weight:600;padding:4px 10px;border-radius:6px;border:1px solid var(--rule);min-width:84px;text-align:center;color:var(--muted)}
.clock.run{color:var(--ink);border-color:var(--ink)}
.clock.low{color:var(--bad);border-color:var(--bad)}
.actions{display:flex;flex-direction:column;gap:8px}
.actions:empty{display:none}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.row>.btn{flex:1 1 0;justify-content:center}
.btn{font:inherit;font-weight:600;font-size:14px;padding:10px 14px;border-radius:7px;border:1px solid var(--rule);background:var(--surface);color:var(--ink);cursor:pointer;text-align:left;display:flex;align-items:center;gap:10px}
.btn:hover:not(:disabled){border-color:var(--muted)}
.btn:focus-visible,.small:focus-visible,.seg button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.btn:disabled{opacity:.45;cursor:default}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);justify-content:center}
.btn.danger{color:var(--bad)}
.btn small{display:block;font-weight:400;font-size:12.5px;opacity:.8}
.btn.suggested{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent)}
.btn.suggested::after{content:attr(data-sugg);margin-left:auto;font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--accent)}
.controls{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.controls .btn{padding:8px 12px;font-size:13.5px}
.level{display:flex;align-items:center;gap:8px;font-size:13.5px;color:var(--muted);margin-left:auto}
select{font:inherit;font-size:14px;padding:7px 8px;border-radius:6px;border:1px solid var(--rule);background:var(--surface);color:var(--ink)}
.opt{display:flex;align-items:center;gap:8px;font-size:14px;cursor:pointer}
.opt input{width:16px;height:16px;accent-color:var(--accent)}
h2{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:0 0 8px;font-weight:700}
.block{border-top:1px solid var(--rule);padding-top:12px}
.review{display:grid;gap:8px}
.review .row .btn{padding:6px 0;font-size:20px;line-height:1}
.review p{margin:0;font-size:13.5px;color:var(--muted);font-variant-numeric:tabular-nums}
.invite{display:grid;gap:10px}
.link{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:6px;align-items:center}
.link label{grid-column:1/-1;font-size:13px;font-weight:600}
.link input{font:inherit;font-size:12.5px;padding:7px 8px;border:1px solid var(--rule);border-radius:6px;background:var(--surface);color:var(--ink);min-width:0;width:100%}
.link .btn{padding:7px 10px;font-size:13px}
.note{font-size:13px;color:var(--muted);margin:0}
.code{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:22px;letter-spacing:.12em;font-weight:700}
.log{max-height:200px;overflow:auto}
.log ol{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:3px 10px;font-variant-numeric:tabular-nums;font-size:13px}
.log li{display:flex;align-items:center;gap:6px;white-space:nowrap}
.log .n{color:var(--muted);width:22px;text-align:right}
.log .x{color:var(--accent);font-weight:700}
.log .cur{font-weight:700;color:var(--accent)}
.log .empty{grid-column:1/-1;color:var(--muted)}
details.rules{font-size:13px;color:var(--muted)}
details.rules summary{cursor:pointer;font-weight:600;color:var(--ink)}
details.rules ul{margin:8px 0 0;padding-left:18px;display:grid;gap:3px}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:9px 14px;border-radius:8px;font-size:14px;font-weight:600;opacity:0;transition:opacity .2s;pointer-events:none;max-width:calc(100% - 32px)}
.toast.on{opacity:1}
/* accueil */
.landing{max-width:900px;margin:0 auto;padding-block:20px 40px;display:grid;gap:24px}
.landing h1{font-size:64px}
.lede{color:var(--muted);max-width:62ch;margin:10px 0 0}
.cards{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px;align-items:start}
.card{background:var(--surface);border:1px solid var(--rule);border-radius:10px;padding:18px;display:flex;flex-direction:column;gap:14px;min-width:0}
.card h2{margin:0;font-size:13px}
.card h3{margin:0;font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.card hr{border:0;border-top:1px solid var(--rule);margin:2px 0;width:100%}
.field{display:grid;gap:4px;font-size:13.5px;font-weight:600}
.field textarea{font:inherit;font-weight:400;font-size:12.5px;padding:8px 10px;border:1px solid var(--rule);border-radius:6px;background:var(--bg);color:var(--ink);width:100%;resize:vertical}
.field input,.field select{font:inherit;font-weight:400;font-size:15px;padding:9px 10px;border:1px solid var(--rule);border-radius:6px;background:var(--bg);color:var(--ink);width:100%}
fieldset{border:0;margin:0;padding:0;display:flex;flex-wrap:wrap;gap:6px 16px}
legend{font-size:13.5px;font-weight:600;margin-bottom:6px;padding:0}
.radio{display:flex;align-items:center;gap:7px;font-size:14px;cursor:pointer}
.radio input{accent-color:var(--accent)}
.err{color:var(--bad);font-weight:600;margin:0;min-height:1.2em}
@media (max-width:860px){.app{grid-template-columns:minmax(0,1fr);gap:18px}.board-wrap{max-width:100%}h1{font-size:34px}.log ol{grid-template-columns:repeat(4,minmax(0,1fr))}}
@media (max-width:680px){.cards{grid-template-columns:minmax(0,1fr)}.landing h1{font-size:48px}}
@media (max-width:480px){.log ol{grid-template-columns:repeat(3,minmax(0,1fr))}.level{margin-left:0}}
/* ---- jeu : l'essentiel toujours dans la fenêtre ---- */
.grow{flex:1}
.topbar{padding-block:8px 0}
.app{padding-block:8px 12px;align-items:start}
.board-wrap{max-width:min(100%,calc(100vh - 64px));max-width:min(100%,calc(100svh - 64px))}
.board-col{position:sticky;top:8px}
.side{position:sticky;top:8px;max-height:calc(100vh - 60px);max-height:calc(100svh - 60px);gap:12px}
.essentials{display:flex;flex-direction:column;gap:12px;flex:none}
.secondary{display:flex;flex-direction:column;gap:14px;flex:1 1 auto;min-height:0;overflow:auto;padding-right:2px}
.secondary h1{font-size:28px}
.opts{display:flex;flex-wrap:wrap;gap:8px 18px;align-items:center}
.opt.snd{cursor:default;flex:1 1 160px}
.actions{flex-direction:row;flex-wrap:nowrap;min-height:44px}
.actions:empty{display:flex}
.actions>.row{display:contents}
.actions>*{flex:1 1 0;min-width:0}
.actions .btn{justify-content:center;padding:9px 6px;font-size:13.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.actions .btn small{display:none}
.actions .btn>span:not(.pstone){overflow:hidden;text-overflow:ellipsis}
.actions .note{align-self:center;margin:0}
.status{height:66px;overflow:hidden}
.status .main,.status .sub{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.status .main span:last-child{overflow:hidden;text-overflow:ellipsis}
.review p{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.players{gap:8px}
.player{background:var(--surface);border:1px solid var(--rule);border-radius:8px;padding:8px 10px;border-bottom:1px solid var(--rule)}
.player:last-child{border-bottom:1px solid var(--rule)}
.player.turn{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent)}
.player .pname{font-size:16px;font-weight:700}
.player .clock{font-size:24px;font-weight:700}
.player .clock.run{color:var(--ink);border-color:var(--ink);background:var(--bg)}
.slot{width:20px;height:12px}.mini{width:6px;height:6px}
.review{border-top:0;padding-top:0}

.opt.snd input[type=range]{flex:1;min-width:60px;width:auto;height:auto;accent-color:var(--accent)}
@media (max-width:860px){
 .app{display:flex;flex-direction:column;align-items:stretch;gap:10px;padding-block:6px 24px}
 .side,.essentials{display:contents}
 .board-col{position:static;order:2;width:100%}
 .board-wrap{max-width:min(100%,calc(100vh - 290px));max-width:min(100%,calc(100svh - 290px));min-width:min(100%,240px)}
 .players{order:1;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:8px}
 .player{grid-template-columns:18px minmax(0,1fr) auto;gap:8px;padding:6px 10px}
 .player .pstone{width:16px;height:16px}
 .player .pname{font-size:15px}.pname small{display:none}
 .slots{margin-top:3px;gap:2px}.slot{width:16px;height:10px}.mini{width:5px;height:5px}
 .player .clock{font-size:21px;min-width:70px;padding:3px 8px}
 .status{order:8;padding:8px 12px;height:58px}.status .main{font-size:16px}.status .sub{font-size:13px;margin-top:2px}
 .review{order:3}.actions{order:4}.controls{order:6}.opts{order:7}
 .secondary{order:9;overflow:visible;margin-top:10px}
 .actions .btn{padding:9px 12px}
}
@media (prefers-reduced-motion:reduce){.toast{transition:none}.thinking .dot{animation:none}}
</style>
</head>
<body>
<div class="topbar gutter">
 <span class="net" id="net" hidden><i></i><span id="netTxt"></span></span>
 <span class="grow"></span>
 <button class="small" id="homeBtn" hidden></button>
 <div class="seg" role="group" aria-label="Langue / Language"><button data-lang="fr">FR</button><button data-lang="en">EN</button></div>
</div>
</div>

<main class="landing gutter" id="home">
 <header>
  <h1>Pente</h1>
  <p class="lede" data-i18n="lede"></p>
 </header>
 <div class="cards">
  <section class="card">
   <h2 data-i18n="vsAI"></h2>
   <label class="field" for="hLevel"><span data-i18n="level"></span><select id="hLevel"></select></label>
   <fieldset><legend data-i18n="opener"></legend>
    <label class="radio"><input type="radio" name="aiFirst" id="afMe" value="me" checked> <span data-i18n="me"></span></label>
    <label class="radio"><input type="radio" name="aiFirst" id="afAi" value="ai"> <span data-i18n="computerCap"></span></label>
   </fieldset>
   <button class="btn primary" id="goAI" data-i18n="play"></button>
  </section>
  <section class="card">
   <h2 data-i18n="vsHuman"></h2>
   <label class="field" for="cName"><span data-i18n="yourName"></span><input id="cName" maxlength="24" autocomplete="nickname"></label>
   <fieldset id="tcSet"><legend data-i18n="timeControl"></legend></fieldset>
   <fieldset><legend data-i18n="firstPlayer"></legend>
    <label class="radio"><input type="radio" name="first" id="fMe" value="me" checked> <span data-i18n="me"></span></label>
    <label class="radio"><input type="radio" name="first" id="fOpp" value="opp"> <span data-i18n="myOpponent"></span></label>
    <label class="radio"><input type="radio" name="first" id="fRnd" value="rnd"> <span data-i18n="random"></span></label>
   </fieldset>
   <button class="btn primary" id="cGo" data-i18n="create"></button>
   <hr>
   <h3 data-i18n="joinTitle"></h3>
   <label class="field" for="jCode"><span data-i18n="code"></span><input id="jCode" maxlength="12" autocomplete="off" placeholder="k7m2qp"></label>
   <div class="row"><button class="btn primary" id="jPlay" data-i18n="join"></button><button class="btn" id="jWatch" data-i18n="watch"></button></div>
   <hr>
   <h3 data-i18n="resumeTitle"></h3>
   <label class="field" for="rIn"><span data-i18n="resumeCode"></span><textarea id="rIn" rows="3" spellcheck="false" autocomplete="off" placeholder="PENTE1.…"></textarea></label>
   <div class="row" id="rSeats"></div>
   <button class="btn" id="rGo" data-i18n="load"></button>
   <p class="note" data-i18n="resumeNote"></p>
  </section>
 </div>
 <p class="err" id="lErr"></p>
 <details class="rules"><summary data-i18n="rules"></summary><ul class="rulesList"></ul></details>
</main>

<div class="app gutter" id="game" hidden>
 <div class="board-col"><div class="board-wrap"><canvas id="cv"></canvas></div></div>
 <aside class="side">
  <div class="essentials">
   <section class="players" id="players"></section>
   <section class="block review" id="review" hidden></section>
   <section class="actions" id="actions"></section>
   <section class="controls" id="aiControls">
    <button class="btn" id="bUndo" data-i18n="undo"></button>
    <button class="btn" id="bHint" data-i18n="hint"></button>
    <label class="level" for="gLevel"><span data-i18n="level"></span><select id="gLevel"></select></label>
   </section>
   <div class="opts">
    <label class="opt" for="optConfirm" id="optWrap"><input type="checkbox" id="optConfirm"> <span data-i18n="confirmOpt"></span></label>
    <div class="opt snd"><label class="opt" for="sndOn"><input type="checkbox" id="sndOn"> <span data-i18n="sounds"></span></label><input type="range" id="sndVol" min="0" max="100" step="5" aria-label="Volume"></div>
   </div>
   <section class="status" id="status"><div class="main"><span class="dot"></span><span id="smain"></span></div><div class="sub" id="ssub"></div></section>
  </div>
  <div class="secondary">
   <header>
    <h1>Pente</h1>
    <div class="tags" id="tags"></div>
   </header>
   <section class="block invite" id="invite" hidden></section>
   <details class="block rules" id="resumeBlk" hidden><summary data-i18n="resumeCodeT"></summary><p class="note" style="margin:8px 0" data-i18n="resumeLast"></p><button class="btn" id="rcCopy" data-i18n="copyResume"></button><div class="link" style="margin-top:8px"><input id="rcTxt" readonly hidden aria-label="Resume code"></div></details>
   <section class="block log"><h2 data-i18n="moves"></h2><ol id="log"></ol></section>
   <details class="block rules"><summary data-i18n="rules"></summary><ul class="rulesList"></ul></details>
  </div>
 </aside>
</div>
<div class="toast" id="toast" role="status"></div>
<script type="text/plain" id="engine-src">
"use strict";
const N=15,NN=225;
const DIRS=[[1,0],[0,1],[1,1],[1,-1]];
const VAL=[0,2,24,260,3200,250000];
const CAPV=[0,420,950,1900,4200,9000];
const WIN=10000000,INF=1000000000,MAXPLY=26;
const board=new Int8Array(NN);
const caps=[0,0,0];
function buildWins(len){const cells=[],per=[];for(let i=0;i<NN;i++)per.push([]);
 for(const [dx,dy] of DIRS)for(let y=0;y<N;y++)for(let x=0;x<N;x++){const ex=x+(len-1)*dx,ey=y+(len-1)*dy;if(ex<0||ex>=N||ey<0||ey>=N)continue;const id=cells.length/len;for(let k=0;k<len;k++){const c=(y+k*dy)*N+x+k*dx;cells.push(c);per[c].push(id);}}
 return {cells:Int16Array.from(cells),n:cells.length/len,per:per.map(a=>Int32Array.from(a))};}
const w5=buildWins(5),w4=buildWins(4);
const W5=w5.cells,NW5=w5.n,CW5=w5.per,W4=w4.cells,NW4=w4.n,CW4=w4.per;
const cnt=[null,new Int8Array(NW5),new Int8Array(NW5)];
const sc=[0,0,0],thr=[0,0,0];
const code4=new Int8Array(NW4);
let rs=0x2545F491;function rnd(){rs^=rs<<13;rs^=rs>>>17;rs^=rs<<5;return rs|0;}
const Z=[new Int32Array(NN),new Int32Array(NN),new Int32Array(NN)];
for(let i=0;i<NN;i++){Z[1][i]=rnd();Z[2][i]=rnd();}
const ZC=[null,new Int32Array(16),new Int32Array(16)];
for(let k=0;k<16;k++){ZC[1][k]=rnd();ZC[2][k]=rnd();}
const ZSIDE=rnd();
let hash=0;

function calc4(q){const b=board[W4[q*4+1]];if(b===0||board[W4[q*4+2]]!==b)return 0;
 const a=board[W4[q*4]],d=board[W4[q*4+3]],o=3-b;
 if((a===o&&d===0)||(a===0&&d===o))return b;return 0;}

function setCell(i,v){const old=board[i];if(old===v)return;
 const cb=cnt[1],cw=cnt[2],L=CW5[i];
 for(let k=0;k<L.length;k++){const w=L[k];let b=cb[w],wh=cw[w];
  if(b&&!wh)sc[1]-=VAL[b];else if(wh&&!b)sc[2]-=VAL[wh];
  if(old===1)b--;else if(old===2)wh--;
  if(v===1)b++;else if(v===2)wh++;
  cb[w]=b;cw[w]=wh;
  if(b&&!wh)sc[1]+=VAL[b];else if(wh&&!b)sc[2]+=VAL[wh];}
 const Q=CW4[i];
 for(let k=0;k<Q.length;k++){const t=code4[Q[k]];if(t)thr[t]--;}
 hash^=Z[old][i]^Z[v][i];board[i]=v;
 for(let k=0;k<Q.length;k++){const q=Q[k],t=calc4(q);code4[q]=t;if(t)thr[t]++;}
}

const mst=[];
function doMove(i,c){setCell(i,c);const o=3-c,x=i%N,y=(i/N)|0;let cap=null;
 for(let dy=-1;dy<=1;dy++)for(let dx=-1;dx<=1;dx++){if(!dx&&!dy)continue;
  const x3=x+3*dx,y3=y+3*dy;if(x3<0||x3>=N||y3<0||y3>=N)continue;
  const s=dy*N+dx,i1=i+s,i2=i1+s;
  if(board[i1]===o&&board[i2]===o&&board[i2+s]===c){if(!cap)cap=[];setCell(i1,0);setCell(i2,0);cap.push(i1,i2);}}
 if(cap){hash^=ZC[c][caps[c]];caps[c]+=cap.length>>1;hash^=ZC[c][caps[c]];}
 mst.push(i,c,cap);}
function undoMove(){const cap=mst.pop(),c=mst.pop(),i=mst.pop();
 if(cap){hash^=ZC[c][caps[c]];caps[c]-=cap.length>>1;hash^=ZC[c][caps[c]];const o=3-c;for(let k=0;k<cap.length;k++)setCell(cap[k],o);}
 setCell(i,0);}
function isWinAfter(i,c){if(caps[c]>=5)return true;const L=CW5[i],cc=cnt[c];for(let k=0;k<L.length;k++)if(cc[L[k]]===5)return true;return false;}

const mark=new Int32Array(NN);let stamp=1;
function hasFour(c){const cc=cnt[c],co=cnt[3-c];for(let w=0;w<NW5;w++)if(cc[w]===4&&co[w]===0)return true;return false;}
function foursOf(c){const cc=cnt[c],co=cnt[3-c],out=[];stamp++;
 for(let w=0;w<NW5;w++)if(cc[w]===4&&co[w]===0){for(let k=0;k<5;k++){const j=W5[w*5+k];if(board[j]===0&&mark[j]!==stamp){mark[j]=stamp;out.push(j);}}}
 return out;}
function capPts(c){const o=3-c,out=[];if(!thr[o])return out;stamp++;
 for(let q=0;q<NW4;q++)if(code4[q]===o){const a=W4[q*4],d=W4[q*4+3],j=board[a]===0?a:d;if(mark[j]!==stamp){mark[j]=stamp;out.push(j);}}
 return out;}
function countCap(e,c){const o=3-c,x=e%N,y=(e/N)|0;let n=0;
 for(let dy=-1;dy<=1;dy++)for(let dx=-1;dx<=1;dx++){if(!dx&&!dy)continue;const x3=x+3*dx,y3=y+3*dy;if(x3<0||x3>=N||y3<0||y3>=N)continue;
  const s=dy*N+dx;if(board[e+s]===o&&board[e+2*s]===o&&board[e+3*s]===c)n++;}
 return n;}
function selfRisk(e,c){const o=3-c,x=e%N,y=(e/N)|0;let n=0;
 for(let dy=-1;dy<=1;dy++)for(let dx=-1;dx<=1;dx++){if(!dx&&!dy)continue;
  const x2=x+2*dx,y2=y+2*dy,xb=x-dx,yb=y-dy;if(x2<0||x2>=N||y2<0||y2>=N||xb<0||xb>=N||yb<0||yb>=N)continue;
  const s=dy*N+dx;if(board[e+s]!==c)continue;const A=board[e-s],B=board[e+2*s];
  if((A===o&&B===0)||(A===0&&B===o))n++;}
 return n;}
function capGain(k){return k>=4?300000:CAPV[k+1]-CAPV[k];}
function capGainE(k){k=Math.min(k,4);return CAPV[k+1]-CAPV[k];}

function moveScore(j,c){const o=3-c,L=CW5[j],cc=cnt[c],co=cnt[o];let a=0,d=0;
 for(let k=0;k<L.length;k++){const w=L[k],m=cc[w],p=co[w];
  if(p===0)a+=VAL[m+1]-VAL[m];else if(m===0)d+=VAL[p+1]-VAL[p];}
 let s=a+d*0.9;
 const n1=countCap(j,c);if(n1)s+=n1*capGain(caps[c])*1.1;
 const n2=countCap(j,o);if(n2)s+=n2*capGain(caps[o])*0.9;
 const r=selfRisk(j,c);if(r)s-=r*capGainE(caps[o])*0.5;
 return s;}

const gscore=new Float64Array(NN);
function gen(c,K){stamp++;const list=[];
 for(let i=0;i<NN;i++){if(!board[i])continue;const x=i%N,y=(i/N)|0;
  for(let dy=-2;dy<=2;dy++)for(let dx=-2;dx<=2;dx++){if(!dx&&!dy)continue;
   const ax=dx<0?-dx:dx,ay=dy<0?-dy:dy;
   if((ax===2||ay===2)&&!(ax===0||ay===0||ax===ay))continue;
   const nx=x+dx,ny=y+dy;if(nx<0||nx>=N||ny<0||ny>=N)continue;
   const j=ny*N+nx;if(board[j]||mark[j]===stamp)continue;mark[j]=stamp;list.push(j);}}
 for(let k=0;k<list.length;k++)gscore[list[k]]=moveScore(list[k],c);
 list.sort((p,q)=>gscore[q]-gscore[p]);
 if(list.length>K)list.length=K;
 return list;}

function evaluate(c){const o=3-c;
 let e=sc[c]*1.12-sc[o];
 e+=CAPV[Math.min(caps[c],5)]-CAPV[Math.min(caps[o],5)];
 e+=thr[o]*capGainE(caps[c])*0.55-thr[c]*capGainE(caps[o])*0.3;
 return e;}

let tt=new Map(),nodes=0,deadline=0,EXT=true,KCAP=99,MAXD=30,NOISE=0;const ABORT={abort:1};
function uniqPush(arr,src){for(const j of src)if(arr.indexOf(j)<0)arr.push(j);}

function search(c,depth,alpha,beta,ply){
 if(((++nodes)&511)===0&&performance.now()>deadline)throw ABORT;
 const o=3-c;
 if(hasFour(c))return WIN-ply;
 if(caps[c]>=4&&thr[o]>0)return WIN-ply;
 if(ply>=MAXPLY)return evaluate(c);
 const ow=foursOf(o);const oc=(caps[o]>=4&&thr[c]>0)?capPts(o):null;
 const forced=ow.length>0||(oc!==null&&oc.length>0);
 if(depth<=0&&(!forced||!EXT))return evaluate(c);
 const key=hash^(c===2?ZSIDE:0);
 const te=tt.get(key);let tm=-1;
 if(te){if(te.d>=depth){if(te.f===0)return te.v;if(te.f===1&&te.v>=beta)return te.v;if(te.f===2&&te.v<=alpha)return te.v;}tm=te.m;}
 let moves;
 if(forced){moves=ow.slice();if(oc)uniqPush(moves,oc);uniqPush(moves,capPts(c));}
 else moves=gen(c,Math.min(KCAP,ply<=1?14:ply<=3?11:8));
 if(!moves.length)return evaluate(c);
 if(tm>=0){const k=moves.indexOf(tm);if(k>0){moves.splice(k,1);moves.unshift(tm);}}
 const nd=(forced&&EXT)?depth:depth-1;
 const a0=alpha;let best=-INF,bm=moves[0];
 for(let k=0;k<moves.length;k++){const m=moves[k];doMove(m,c);let v;
  if(isWinAfter(m,c))v=WIN-ply-1;else v=-search(o,nd,-beta,-alpha,ply+1);
  undoMove();
  if(v>best){best=v;bm=m;if(v>alpha){alpha=v;if(alpha>=beta)break;}}}
 if(tt.size>700000)tt.clear();
 tt.set(key,{d:depth,v:best,f:best<=a0?2:best>=beta?1:0,m:bm});
 return best;}

function think(c,ms,P){P=P||{};EXT=P.ext!==false;KCAP=P.k||99;MAXD=P.maxDepth||30;NOISE=P.noise||0;
 const t0=performance.now();deadline=t0+ms;nodes=0;tt=new Map();
 const o=3-c;
 const myF=foursOf(c);if(myF.length)return {move:myF[0],score:WIN,depth:1};
 if(caps[c]>=4){const cp=capPts(c);if(cp.length)return {move:cp[0],score:WIN,depth:1};}
 let rootMoves;
 const ow=foursOf(o),oc=caps[o]>=4?capPts(o):[];
 if(ow.length||oc.length){rootMoves=ow.slice();uniqPush(rootMoves,oc);uniqPush(rootMoves,capPts(c));}
 else rootMoves=gen(c,Math.min(22,KCAP*2));
 if(!rootMoves.length){if(!board[112])return {move:112,score:0,depth:0};for(let i=0;i<NN;i++)if(!board[i])return {move:i,score:0,depth:0};return {move:-1,score:0,depth:0};}
 if(rootMoves.length===1)return {move:rootMoves[0],score:0,depth:0};
 let best=rootMoves[0],bestScore=0,depthDone=0;
 const scores=new Map();
 const base=mst.length;
 for(let d=1;d<=MAXD;d++){
  let alpha=-INF,curBest=-1,curScore=-INF;
  try{
   for(const m of rootMoves){doMove(m,c);let v;
    if(isWinAfter(m,c))v=WIN-1;else v=-search(o,d-1,-INF,NOISE?INF:-alpha,1);
    undoMove();scores.set(m,v);
    if(v>curScore){curScore=v;curBest=m;if(v>alpha)alpha=v;}}
  }catch(e){if(e!==ABORT)throw e;while(mst.length>base)undoMove();
   if(curBest>=0&&curBest!==best&&curScore>bestScore+50&&d>1){best=curBest;bestScore=curScore;}
   break;}
  best=curBest;bestScore=curScore;depthDone=d;
  rootMoves.sort((p,q)=>(scores.get(q)??-INF)-(scores.get(p)??-INF));
  if(Math.abs(curScore)>WIN-1000)break;
  if(performance.now()-t0>ms*0.45)break;
 }
 if(NOISE&&depthDone>0){let bv=-INF;for(const m of rootMoves){const v=scores.get(m);if(v===undefined)continue;const nv=Math.abs(v)>WIN-1000?v:v+Math.random()*NOISE;if(nv>bv){bv=nv;best=m;bestScore=v;}}}
 return {move:best,score:Math.round(bestScore),depth:depthDone,nodes};}

function loadBoard(arr,cp){for(let i=0;i<NN;i++)if(board[i])setCell(i,0);
 caps[1]=cp[1]|0;caps[2]=cp[2]|0;mst.length=0;
 for(let i=0;i<NN;i++)if(arr[i])setCell(i,arr[i]);}

function randomOpening(){const ri=(a,b)=>a+Math.floor(Math.random()*(b-a+1));
 const b1=(7+ri(-1,1))*N+7+ri(-1,1);const bx=b1%N,by=(b1/N)|0;
 let w,b2;
 do{const dx=ri(-2,2),dy=ri(-2,2);w=(by+dy)*N+bx+dx;}while(w===b1);
 do{const dx=ri(-3,3),dy=ri(-3,3);b2=(by+dy)*N+bx+dx;}while(b2===b1||b2===w);
 return [{i:b1,c:1},{i:w,c:2},{i:b2,c:1}];}
function propose(ms){const tries=16,per=Math.max(40,(ms/tries)|0);let best=null,bs=INF;
 for(let t=0;t<tries;t++){const s=randomOpening();const arr=new Int8Array(NN);for(const p of s)arr[p.i]=p.c;
  loadBoard(arr,[0,0,0]);const r=think(2,per);const v=Math.abs(r.score)+Math.random()*60;
  if(v<bs){bs=v;best={stones:s,score:r.score};}}
 return best;}

function suggestPlace(arr,c,ms){loadBoard(arr,[0,0,0]);let any=false;for(let i=0;i<NN;i++)if(board[i]){any=true;break;}
 const ctr=(N>>1)*N+(N>>1);if(!any)return {move:ctr,score:0};
 const cx=N>>1;let cand=gen(c,30).filter(j=>Math.abs(j%N-cx)<=4&&Math.abs(((j/N)|0)-cx)<=4).slice(0,12);
 if(!cand.length)cand=gen(c,12);
 const per=Math.max(60,(ms/cand.length)|0);let best=cand[0],bs=INF,bsc=0;
 for(const j of cand){setCell(j,c);const r=think(2,per);setCell(j,0);const v=Math.abs(r.score);if(v<bs){bs=v;best=j;bsc=r.score;}}
 return {move:best,score:bsc};}

if(typeof WorkerGlobalScope!=='undefined'){
 self.onmessage=function(e){const m=e.data;
  if(m.type==='place'){const r=suggestPlace(m.board,m.c,m.ms);self.postMessage({id:m.id,move:r.move,score:r.score});return;}
  if(m.type==='propose'){const r=propose(m.ms);self.postMessage({id:m.id,stones:r.stones,score:r.score});return;}
  loadBoard(m.board,m.caps);const r=think(m.c,m.ms,m.opt);self.postMessage({id:m.id,move:r.move,score:r.score,depth:r.depth});};
}

  try{const L=localStorage,S1=sessionStorage;let id=S1.getItem(key+'-tab');
    if(!id){let ids=[];try{ids=JSON.parse(L.getItem(key+'-tabs')||'[]')||[];}catch(e){}if(!ids.length&&seed)ids=[seed];const now=Date.now();
      id=ids.slice().reverse().find(x=>now-(+L.getItem(key+'-alive-'+x)||0)>5000);
      if(!id){id=R();ids.push(id);}L.setItem(key+'-tabs',JSON.stringify(ids.filter((x,k)=>ids.indexOf(x)===k).slice(-10)));S1.setItem(key+'-tab',id);}
    const beat=()=>{try{L.setItem(key+'-alive-'+id,String(Date.now()));}catch(e){}};beat();setInterval(beat,1500);return id;}catch(e){return R();}}
function hh(t){let h=2166136261;t=String(t||'');for(let k=0;k<t.length;k++){h^=t.charCodeAt(k);h=Math.imul(h,16777619);}return (h>>>0).toString(36);}

function capture(B,i,c){const o=3-c,x=i%N,y=(i/N)|0,cap=[];B[i]=c;
 for(let dy=-1;dy<=1;dy++)for(let dx=-1;dx<=1;dx++){if(!dx&&!dy)continue;const x3=x+3*dx,y3=y+3*dy;if(x3<0||x3>=N||y3<0||y3>=N)continue;
  const s=dy*N+dx;if(B[i+s]===o&&B[i+2*s]===o&&B[i+3*s]===c){B[i+s]=0;B[i+2*s]=0;cap.push(i+s,i+2*s);}}
 return cap;}
function lineAt(B,i,c){const x=i%N,y=(i/N)|0;
 for(const [dx,dy] of DIRS){const cells=[i];for(const s of [1,-1]){let nx=x+dx*s,ny=y+dy*s;while(nx>=0&&nx<N&&ny>=0&&ny<N&&B[ny*N+nx]===c){cells.push(ny*N+nx);nx+=dx*s;ny+=dy*s;}}
  if(cells.length>=5)return cells.sort((a,b)=>a-b);}
 return null;}
function newState(code,first,names,th,game,tc){return {v:2,code,game:game||1,phase:'wait',first,names,color:{H:0,G:0},B:new Array(NN).fill(0),caps:[0,0,0],toMove:2,log:[],lastCap:[],
 tc:tc||null,clocks:{H:tc?tc.base:0,G:tc?tc.base:0},turnStart:0,result:null,th:th||{H:null,G:null},ready:{H:false,G:false},ver:0,paused:false};}
function turnSeat(s){if(!s||s.result||s.phase==='wait')return null;
 if(s.phase==='open'||s.phase==='choose1')return s.first;
 if(s.phase==='choose')return other(s.first);
 return s.color.H===s.toMove?'H':'G';}
function act(s,seat,a,now){
 if(s.result)return 'e_over';
 if(a.t==='start'){if(s.phase!=='wait')return 'e_started';if(!(s.th&&s.th.H&&s.th.G))return 'e_noOpp';
  s.ready=s.ready||{};s.ready[seat]=true;if(s.ready.H&&s.ready.G){s.phase='open';s.turnStart=now;}return null;}
 const ts=turnSeat(s);
 if(a.t==='resign'){if(!ts)return 'e_notStarted';if(s.tc)s.clocks[ts]=Math.max(0,s.clocks[ts]-(s.paused?0:now-s.turnStart));s.turnStart=now;s.result={winner:other(seat),code:'resign'};return null;}
 if(s.paused)return 'e_paused';
 if(seat!==ts)return 'e_notTurn';
 let left=0;
 if(s.tc){left=s.clocks[seat]-(now-s.turnStart);if(left<=0){s.clocks[seat]=0;s.turnStart=now;s.result={winner:other(seat),code:'time'};return null;}}
 const ok=arr=>Array.isArray(arr)&&arr.every((i,k)=>Number.isInteger(i)&&i>=0&&i<NN&&!s.B[i]&&arr.indexOf(i)===k);
 const put=(i,c)=>{s.B[i]=c;s.log.push({c,i,cap:0,o:1});};
 if(s.phase==='open'){
  if(a.t!=='open'||!ok(a.stones)||a.stones.length!==3)return 'e_badOpen';
  a.stones.forEach((i,k)=>put(i,[1,2,1][k]));s.lastCap=[];s.phase='choose';}
 else if(s.phase==='choose'){
  if(a.t==='pick'&&(a.color===1||a.color===2)){s.color[seat]=a.color;s.color[other(seat)]=3-a.color;s.phase='play';s.toMove=2;}
  else if(a.t==='add2'&&ok(a.stones)&&a.stones.length===2){put(a.stones[0],1);put(a.stones[1],2);s.phase='choose1';}
  else return 'e_badChoice';}
 else if(s.phase==='choose1'){
  if(a.t!=='pick'||!(a.color===1||a.color===2))return 'e_badChoice';
  s.color[seat]=a.color;s.color[other(seat)]=3-a.color;s.phase='play';s.toMove=2;}
 else if(s.phase==='play'){
  if(a.t!=='move'||!ok([a.i]))return 'e_badMove';
  const c=s.toMove,cap=capture(s.B,a.i,c);s.caps[c]+=cap.length/2;s.lastCap=cap;s.log.push({c,i:a.i,cap:cap.length/2});
  const line=lineAt(s.B,a.i,c);
  if(line)s.result={winner:seat,code:line.length>5?'line':'five',n:line.length,line};
  else if(s.caps[c]>=5)s.result={winner:seat,code:'caps'};
  else if(s.B.every(v=>v))s.result={winner:null,code:'full'};
  else s.toMove=3-c;}
 if(s.tc)s.clocks[seat]=left+(s.result?0:s.tc.inc);
 s.turnStart=now;
 return null;}
function replay(log,k){const B=new Array(NN).fill(0),caps=[0,0,0];let lastCap=[];
 for(let j=0;j<k;j++){const e=log[j];if(e.o){B[e.i]=e.c;lastCap=[];}else{const cap=capture(B,e.i,e.c);caps[e.c]+=cap.length/2;lastCap=cap;}}
 return {B,caps,lastCap,last:k>0?log[k-1].i:-1};}

let worker=null,reqId=0,cbs={};
function makeWorker(){worker=new Worker(URL.createObjectURL(new Blob([$('engine-src').textContent],{type:'text/javascript'})));
 worker.onmessage=e=>{const cb=cbs[e.data.id];delete cbs[e.data.id];if(cb)cb(e.data);};}
function resetWorker(){if(worker)worker.terminate();cbs={};worker=null;busy='';}
function ask(msg,cb){if(!worker)makeWorker();msg.id=++reqId;cbs[msg.id]=cb;worker.postMessage(msg);}
function stateKey(){return S?S.game+':'+S.phase+':'+S.log.length+':'+(S.result?1:0):'';}

function startAI(){leaveCurrent();mode='ai';mySeat='H';code=null;
 const first=document.querySelector('input[name="aiFirst"]:checked').value==='me'?'H':'G';
 S=newState(null,first,{H:'',G:''},null,1,null);S.phase='open';S.turnStart=Date.now();
 hist=[];aiInfo=null;clearHint();review=null;tent=[];localMode='';showGame();aiStep();}
function aiStep(){if(mode!=='ai'||!S||S.result||busy)return;if(turnSeat(S)!=='G')return;
 const L=LEVELS[level],key=stateKey();busy='ai';
 const done=(a,info)=>{busy='';if(mode!=='ai'||stateKey()!==key){render();return;}aiInfo=info;act(S,'G',a,Date.now());render();aiStep();};
 if(S.phase==='open')ask({type:'propose',ms:1500},r=>done({t:'open',stones:r.stones.map(x=>x.i)},null));
 else if(S.phase==='choose'||S.phase==='choose1')ask({type:'move',board:S.B.slice(),caps:S.caps.slice(),c:2,ms:L.ms,opt:Object.assign({},L,{noise:0})},r=>done({t:'pick',color:r.score>=0?2:1},{k:r.score>=0?'ai_tookWhite':'ai_tookBlack'}));
 else ask({type:'move',board:S.B.slice(),caps:S.caps.slice(),c:S.toMove,ms:L.ms,opt:L},r=>done({t:'move',i:r.move},evalInfo(r)));
 render();}
function evalInfo(r){const s=r.score;if(!r.depth)return {k:'ai_forced'};
 if(s>WIN-1000)return {k:'ai_win'};if(s<-(WIN-1000))return {k:'ai_lost'};
 const k=Math.abs(s)<250?'ai_eq':s>0?(s>2500?'ai_much':'ai_better'):(s<-2500?'ai_muchWorse':'ai_worse');return {k,d:r.depth};}
function clearHint(){hint=-1;hintOpt='';hintMsg=null;}
function canHint(){if(mode!=='ai'||busy||!S||S.result||turnSeat(S)!=='H')return false;
 const p=placing();if(p)return tent.length<p.colors.length||p.colors.length===1;

function doHint(){if(!canHint())return;const key=stateKey();busy='hint';render();
 const fin=()=>{busy='';};
 const p=placing();
 if(p&&S.phase==='play'){ask({type:'move',board:S.B.slice(),caps:S.caps.slice(),c:S.toMove,ms:HINT.ms,opt:HINT},r=>{fin();if(stateKey()!==key)return render();hint=r.move;hintMsg={k:'hint_move',c:coord(r.move)};render();});return;}
 if(p){const board=S.B.slice();tent.forEach((i,k)=>board[i]=p.colors[k]);const col=p.colors[tent.length];
  ask({type:'place',board,c:col,ms:HINT.ms},r=>{fin();if(stateKey()!==key)return render();hint=r.move;hintMsg={k:'hint_place',col,c:coord(r.move)};render();});return;}
 ask({type:'move',board:S.B.slice(),caps:S.caps.slice(),c:2,ms:HINT.ms,opt:HINT},r=>{fin();if(stateKey()!==key)return render();const s=r.score;
  if(S.phase==='choose'&&Math.abs(s)<=250){hintOpt='aX';hint=-1;hintMsg={k:'hint_add'};}
  else if(s>=0){hintOpt='aW';hint=r.move;hintMsg={k:'hint_white',c:coord(r.move)};}
  else{hintOpt='aB';hint=-1;hintMsg={k:'hint_black'};}
  render();});}

 const pr=new Peer(PID(code),peerOpts());peer=pr;

  c.on('close',()=>{conns.delete(c);if(pr!==peer)return;if(c===oppConn){oppConn=null;toast(t('t_oppPause'));}if(mode==='host')changed();});c.on('error',()=>{});});

 const lg=document.querySelector('.log');if(!(S.rv&&S.rv.on))lg.scrollTop=lg.scrollHeight;
 draw();}
function goReview(k){if(!S||!S.result||!S.rv||!S.rv.on||S.rv.ctrl!==mySeat)return;rvOp({op:'nav',k});}
function rvView(){const R=S.rv,base=replay(S.log,R.k),B=base.B,caps=base.caps;let lastCap=base.lastCap,last=base.last;
 let next=1;if(R.k>0){const e=S.log[R.k-1];next=e.o&&(R.k===S.log.length||!S.log[R.k].o)?2:3-e.c;}
 for(const m of R.alt){const cap=capture(B,m.i,m.c);caps[m.c]+=cap.length/2;lastCap=cap;last=m.i;next=3-m.c;}
 return {B,caps,lastCap,last,next};}
function rvApply(seat,a){if(!S||!S.result||!S.log.length||!a)return;const n=S.log.length,R=S.rv;
 if(a.op==='enter'){if(!(R&&R.on))S.rv={on:true,ctrl:seat,k:n,alt:[]};return;}
 if(!R||!R.on||R.ctrl!==seat)return;
 if(a.op==='nav'){R.k=Math.max(0,Math.min(n,a.k|0));R.alt=[];}
 else if(a.op==='step'){R.k=Math.max(0,Math.min(n,R.k+(a.d|0)));R.alt=[];}
 else if(a.op==='back')R.alt=[];
 else if(a.op==='alt'){const i=a.i;if(!Number.isInteger(i)||i<0||i>=NN)return;const V=rvView();if(V.B[i])return;R.alt.push({i,c:V.next});}
 else if(a.op==='give'){if(mode!=='ai')R.ctrl=other(seat);}
 else if(a.op==='exit')S.rv=null;}
function rvOp(a){if(!S)return;
 if(mode==='ai'){rvApply(mySeat,a);render();}
 else if(mode==='host'){rvApply(mySeat,a);changed();}
 else if(mode==='guest'&&conn&&conn.open)conn.send({k:'rv',a});}
function viewState(){if(S.rv&&S.rv.on&&S.result)return rvView();if(review!==null&&S.result)return replay(S.log,review);return {B:S.B,caps:S.caps,lastCap:S.lastCap||[],last:S.log.length?S.log[S.log.length-1].i:-1};}
function linkRow(id,label,url){return `<div class="link"><label for="${id}">${esc(label)}</label><input id="${id}" readonly value="${esc(url)}"><button class="btn" data-copy="${id}">${t('copy')}</button></div>`;}
function copyInput(inp){const v=inp.value;if(navigator.clipboard&&navigator.clipboard.writeText)navigator.clipboard.writeText(v).then(()=>toast(t('copied')),()=>{inp.select();toast(t('copySel'));});else{inp.select();toast(t('copySel'));}}
function copyText(v){if(navigator.clipboard&&navigator.clipboard.writeText)navigator.clipboard.writeText(v).then(()=>toast(v),()=>toast(v));else toast(v);}

/* ================= plateau ================= */
const cv=$('cv'),ctx=cv.getContext('2d');let hover=-1;
function geom(){const s=cv.clientWidth;const cell=s/(N-1+2.5);return {s,cell,pad:cell*1.25};}
function stone(x,y,r,c,a){ctx.save();ctx.globalAlpha=a;
 if(a>0.9){ctx.beginPath();ctx.arc(x+r*.1,y+r*.14,r,0,7);ctx.fillStyle='rgba(50,30,10,.38)';ctx.fill();}
 const g=ctx.createRadialGradient(x-r*.35,y-r*.4,r*.08,x,y,r);
 if(c===1){g.addColorStop(0,'#5d6260');g.addColorStop(1,'#0e100f');}else{g.addColorStop(0,'#ffffff');g.addColorStop(1,'#d3d1c9');}
 ctx.beginPath();ctx.arc(x,y,r,0,7);ctx.fillStyle=g;ctx.fill();ctx.restore();}
function draw(){const {s,cell,pad}=geom();if(!s)return;const dpr=window.devicePixelRatio||1,px=Math.round(s*dpr);
 if(cv.width!==px){cv.width=px;cv.height=px;}ctx.setTransform(dpr,0,0,dpr,0,0);
 const P=k=>pad+k*cell,R=v=>Math.round(v)+.5;
 const g=ctx.createLinearGradient(0,0,s,s);g.addColorStop(0,'#D5B17B');g.addColorStop(1,'#B88E56');ctx.fillStyle=g;ctx.fillRect(0,0,s,s);
 const v=ctx.createRadialGradient(s/2,s/2,s*.2,s/2,s/2,s*.75);v.addColorStop(0,'rgba(255,240,210,.12)');v.addColorStop(1,'rgba(60,35,10,.16)');ctx.fillStyle=v;ctx.fillRect(0,0,s,s);
 ctx.strokeStyle='rgba(58,40,20,.75)';ctx.lineWidth=1;ctx.beginPath();
 for(let k=0;k<N;k++){const q=R(P(k));ctx.moveTo(R(P(0)),q);ctx.lineTo(R(P(N-1)),q);ctx.moveTo(q,R(P(0)));ctx.lineTo(q,R(P(N-1)));}
 ctx.stroke();ctx.lineWidth=1.6;ctx.strokeRect(R(P(0)),R(P(0)),Math.round(P(N-1))-Math.round(P(0)),Math.round(P(N-1))-Math.round(P(0)));
 ctx.fillStyle='rgba(58,40,20,.85)';
 for(const a of [3,7,11])for(const b of [3,7,11]){ctx.beginPath();ctx.arc(P(a),P(b),Math.max(2,cell*.11),0,7);ctx.fill();}
 ctx.strokeStyle='rgba(58,40,20,.7)';ctx.lineWidth=1.2;ctx.beginPath();ctx.arc(P(7),P(7),cell*.28,0,7);ctx.stroke();
 ctx.fillStyle='rgba(58,40,20,.7)';ctx.font=`600 ${Math.max(8,cell*.36)}px Figtree, system-ui, sans-serif`;ctx.textAlign='center';ctx.textBaseline='middle';
 for(let k=0;k<N;k++){ctx.fillText(LET[k],P(k),s-pad*.45);ctx.fillText(String(N-k),pad*.45,P(k));}
 if(!S||!mode)return;
 const r=cell*.47,MK='#C42B3A',V=viewState();
 for(let i=0;i<NN;i++)if(V.B[i])stone(P(i%N),P((i/N)|0),r,V.B[i],1);
 for(const i of V.lastCap){if(V.B[i])continue;const x=P(i%N),y=P((i/N)|0),d=cell*.18;ctx.strokeStyle=MK;ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(x-d,y-d);ctx.lineTo(x+d,y+d);ctx.moveTo(x+d,y-d);ctx.lineTo(x-d,y+d);ctx.stroke();}
 if(V.last>=0&&V.B[V.last]){ctx.fillStyle=MK;ctx.beginPath();ctx.arc(P(V.last%N),P((V.last/N)|0),r*.24,0,7);ctx.fill();}
 const p=placing();
 if(p){tent.forEach((i,k)=>{const x=P(i%N),y=P((i/N)|0);stone(x,y,r,p.colors[k],.8);ctx.save();ctx.strokeStyle=MK;ctx.lineWidth=2;ctx.setLineDash([4,3]);ctx.beginPath();ctx.arc(x,y,r*1.05,0,7);ctx.stroke();ctx.restore();
   if(p.colors.length>1){ctx.fillStyle=p.colors[k]===1?'#fff':'#222';ctx.font=`700 ${cell*.42}px Figtree, system-ui, sans-serif`;ctx.fillText(String(k+1),x,y+1);}});
  if(hint>=0&&!S.B[hint]&&tent.indexOf(hint)<0){ctx.save();ctx.strokeStyle=MK;ctx.lineWidth=2;ctx.setLineDash([2,3]);ctx.beginPath();ctx.arc(P(hint%N),P((hint/N)|0),r*.85,0,7);ctx.stroke();ctx.restore();}
  const hc=tent.length<p.colors.length?p.colors[tent.length]:(p.colors.length===1?p.colors[0]:0);
  if(hover>=0&&hc&&!S.B[hover]&&tent.indexOf(hover)<0&&busy!=='hint')stone(P(hover%N),P((hover/N)|0),r,hc,.4);}
 else if(hint>=0&&!S.B[hint]){ctx.save();ctx.strokeStyle=MK;ctx.lineWidth=2;ctx.setLineDash([2,3]);ctx.beginPath();ctx.arc(P(hint%N),P((hint/N)|0),r*.85,0,7);ctx.stroke();ctx.restore();}
 if(S.rv&&S.rv.on&&S.rv.alt.length){ctx.save();ctx.font=`700 ${cell*.4}px Figtree, system-ui, sans-serif`;ctx.textAlign='center';ctx.textBaseline='middle';S.rv.alt.forEach((m,j)=>{if(V.B[m.i]===m.c){ctx.fillStyle=m.c===1?'#fff':'#222';ctx.fillText(String(j+1),P(m.i%N),P((m.i/N)|0)+1);}});ctx.restore();}
 if(S.result&&S.result.line&&review===null&&!(S.rv&&S.rv.on)){const L=S.result.line,a=L[0],b=L[L.length-1];ctx.save();ctx.strokeStyle=MK;ctx.globalAlpha=.85;ctx.lineWidth=Math.max(3,cell*.16);ctx.lineCap='round';ctx.beginPath();ctx.moveTo(P(a%N),P((a/N)|0));ctx.lineTo(P(b%N),P((b/N)|0));ctx.stroke();ctx.restore();}}
function cellAt(e){const {cell,pad}=geom();const rc=cv.getBoundingClientRect();const x=Math.round((e.clientX-rc.left-pad)/cell),y=Math.round((e.clientY-rc.top-pad)/cell);
 if(x<0||x>=N||y<0||y>=N)return -1;return y*N+x;}
cv.addEventListener('pointermove',e=>{const i=cellAt(e);if(i!==hover){hover=i;draw();}cv.style.cursor=placing()?'pointer':'default';});
cv.addEventListener('pointerleave',()=>{hover=-1;draw();});
cv.addEventListener('click',e=>{const i=cellAt(e);if(i>=0)onCell(i);});
new ResizeObserver(()=>draw()).observe(cv);
if(document.fonts&&document.fonts.ready)document.fonts.ready.then(draw);
document.addEventListener('keydown',e=>{if(!S||!S.result||!S.rv||!S.rv.on||S.rv.ctrl!==mySeat||/INPUT|SELECT|TEXTAREA/.test(document.activeElement.tagName))return;const n=S.log.length,k=S.rv.k;
 if(e.key==='ArrowLeft'){rvOp({op:'step',d:-1});e.preventDefault();}else if(e.key==='ArrowRight'){rvOp({op:'step',d:1});e.preventDefault();}
 else if(e.key==='Home'){goReview(0);e.preventDefault();}else if(e.key==='End'){goReview(n);e.preventDefault();}});

/* ================= navigation ================= */
function setHash(h){try{history.replaceState(null,'',h?'#'+h:location.pathname+location.search);}catch(e){location.hash=h;}}
function showGame(){$('home').hidden=true;$('game').hidden=false;render();}
function leaveCurrent(){timers.forEach(x=>{clearInterval(x);clearTimeout(x);});timers=[];clearTimeout(retryT);retryT=null;clearTimeout(connT);lostSince=0;
 for(const c of conns){try{c.close();}catch(_){}}conns.clear();oppConn=null;
 if(conn){try{conn.close();}catch(_){}}conn=null;if(peer){try{peer.destroy();}catch(_){}}peer=null;
 resetWorker();mode=null;S=null;mySeat=null;pending=false;tent=[];localMode='';review=null;resignArm=false;clearHint();aiInfo=null;hist=[];}
function goHome(){if(mode==='host'&&code)store.del('pente-host-'+code);leaveCurrent();setHash('');homeArm=false;document.title='Pente';$('game').hidden=true;$('home').hidden=false;$('lErr').textContent='';render();}
$('homeBtn').onclick=()=>{const live=S&&!S.result&&S.phase!=='wait'&&mySeat;
 if(live&&!homeArm){homeArm=true;render();clearTimeout(homeArmT);homeArmT=setTimeout(()=>{homeArm=false;render();},4000);return;}
 goHome();};
document.querySelectorAll('[data-lang]').forEach(b=>b.onclick=()=>{lang=b.dataset.lang;store.set('pente-lang',lang);applyStatic();});
$('optConfirm').addEventListener('change',e=>{confirmOn=e.target.checked;store.set('pente-confirm',confirmOn?'1':'0');if(!confirmOn&&tent.length){const p=placing();if(p&&tent.length===p.colors.length){commit();return;}}render();});
for(const sel of ['hLevel','gLevel'])$(sel).addEventListener('change',e=>{level=e.target.value;store.set('pente-level',level);$('hLevel').value=level;$('gLevel').value=level;render();});
$('bUndo').onclick=undo;$('bHint').onclick=doHint;
$('goAI').onclick=startAI;
const savedName=store.get('pente-name')||'';$('cName').value=savedName;
function cleanCode(v){return String(v||'').trim().toLowerCase().replace(/[^a-z0-9]/g,'');}
$('cGo').onclick=()=>{const nm=$('cName').value.trim().slice(0,24);if(nm)store.set('pente-name',nm);
 const f=document.querySelector('input[name="first"]:checked').value;const fs=f==='me'?'H':f==='opp'?'G':(Math.random()<.5?'H':'G');
 const tc=TCS.find(x=>x.id===tcChoice);leaveCurrent();
 code=rid(6);mode='host';mySeat='H';S=newState(code,fs,{H:nm||t('hostDefault'),G:''},{H:hh(token),G:null},1,tc.base?tc:null);save();setHash('host-'+code);showGame();startHost();hostTimers();};
function join(asWatch){const c=cleanCode($('jCode').value);if(c.length<4){$('lErr').textContent=t('e_code');return;}
 const nm=$('cName').value.trim().slice(0,24);if(nm)store.set('pente-name',nm);
 leaveCurrent();refused=false;code=c;mode=asWatch?'watch':'guest';setHash((asWatch?'watch-':'join-')+code);$('home').hidden=true;$('game').hidden=false;
 S=null;render();$('smain').textContent=t('st_connecting');$('ssub').textContent=t('codeLine',{code});$('players').innerHTML='';$('actions').innerHTML='';$('review').hidden=true;$('invite').hidden=true;$('log').innerHTML='';$('aiControls').hidden=true;$('optWrap').hidden=true;$('net').hidden=false;
 startGuest();}
$('jPlay').onclick=()=>join(false);$('jWatch').onclick=()=>join(true);
/* ================= code de reprise ================= */
function exportCode(){const p=JSON.parse(JSON.stringify(pub()));const ts=turnSeat(S);if(ts&&S.tc&&!S.paused)p.clocks[ts]=remaining(ts);
 delete p.th;p.paused=false;p.ready={H:false,G:false};p.ver=0;return 'PENTE1.'+btoa(unescape(encodeURIComponent(JSON.stringify(p))));}
function importCode(v){v=String(v||'').replace(/\s+/g,'');if(v.indexOf('PENTE1.')!==0)throw 0;
 const p=JSON.parse(decodeURIComponent(escape(atob(v.slice(7)))));if(!p||!Array.isArray(p.B)||p.B.length!==NN||!p.clocks||!p.names)throw 0;return p;}
$('rcCopy').onclick=()=>{if(!S)return;const inp=$('rcTxt');inp.value=exportCode();inp.hidden=false;
 if(navigator.clipboard&&navigator.clipboard.writeText)navigator.clipboard.writeText(inp.value).then(()=>toast(t('resumeCopied')),()=>{inp.select();toast(t('copySel'));});else{inp.select();toast(t('copySel'));}};
$('rGo').onclick=()=>{let p;try{p=importCode($('rIn').value);}catch(e){$('lErr').textContent=t('e_badResume');$('rSeats').innerHTML='';return;}
 $('lErr').textContent='';const box=$('rSeats');
 box.innerHTML=['H','G'].map(k=>`<button class="btn primary" data-seat="${k}" style="justify-content:center">${esc(t('iAm',{name:p.names[k]||t(k==='H'?'hostDefault':'guestDefault')}))}</button>`).join('');
 box.querySelectorAll('[data-seat]').forEach(b=>b.onclick=()=>resumeAs(b.dataset.seat,p));};
function resumeAs(seat,p){if(!peerReady())return;leaveCurrent();code=rid(6);mode='host';S=p;S.code=code;S.th={H:null,G:null};S.th[seat]=hh(token);S.ver=0;S.turnStart=Date.now();S.paused=!!turnSeat(S);
 if(!S.ready)S.ready={H:false,G:false};mySeat=seat;save();setHash('host-'+code);showGame();startHost();hostTimers();}
sndBind();
applyStatic();
(function boot(){const m=/^#(host|join|watch)-([a-z0-9]+)$/.exec(location.hash);if(!m)return;
 if(m[1]==='host'){const raw=store.get('pente-host-'+m[2]);if(!raw){$('lErr').textContent=t('e_nogame');return;}
  try{S=JSON.parse(raw);}catch(e){return;}code=m[2];mode='host';
  if(!S.th){S.th={H:hh(token),G:S.gtoken?hh(S.gtoken):null};delete S.gtoken;}if(!S.ready)S.ready={H:true,G:true};
  mySeat=seatOf()||'H';freeze(S.savedAt||S.turnStart);showGame();startHost();hostTimers();return;}
 $('jCode').value=m[2];
 if(m[1]==='join'&&!store.get('pente-name')){$('lErr').textContent=t('e_invitedName');$('cName').focus();return;}
 join(m[1]==='watch');})();
})();
