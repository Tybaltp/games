function pick(e){const r=c.getBoundingClientRect(),sx=(e.clientX-r.left)*W/r.width;go(Math.round((sx-L)/(W-L-R)*125+1));}
c.addEventListener('pointerdown',e=>{pick(e);c.setPointerCapture(e.pointerId);});c.addEventListener('pointermove',e=>{if(e.buttons)pick(e);});
function go(k){cur=Math.max(1,Math.min(126,k));const p=P[cur-1],prev=cur>1?P[cur-2]:null;
 cr.setAttribute('x1',x(cur));cr.setAttribute('x2',x(cur));dot.setAttribute('cx',x(cur));dot.setAttribute('cy',y(p.v));
 const f=v=>(v>0?'+':'')+v.toFixed(2);
 document.getElementById('info').innerHTML=`<div><b>Position après le coup ${cur-1}</b></div>`+
  (prev?`<div>Dernier coup : ${prev.who}, ${prev.m}</div>`:'<div>Position de départ</div>')+
  `<div class=ev>${cur===126?'Tybalt gagne':f(p.v)}</div>`+
  (cur<126?`<div>Au trait : ${p.who}<br>Joué ensuite : ${p.m}${showBest?'<br>IA : '+p.b+(p.same?' (le même)':''):''}</div>`:'');
 drawBoard();}
const bb=document.getElementById('bestBtn');bb.onclick=()=>{showBest=!showBest;bb.classList.toggle('on',showBest);go(cur);};
document.getElementById('first').onclick=()=>go(1);document.getElementById('last').onclick=()=>go(126);
document.getElementById('prev').onclick=()=>go(cur-1);document.getElementById('next').onclick=()=>go(cur+1);
addEventListener('keydown',e=>{if(e.key==='ArrowLeft')go(cur-1);if(e.key==='ArrowRight')go(cur+1);if(e.key==='b')bb.click();});
const h=(location.hash||location.search).match(/^[#?]([0-9]+)(b?)/);if(h){if(h[2])bb.click();go(+h[1]);}else go(1);
</script></html>
