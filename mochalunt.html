<style>
/* ice blue, as the home page */
:root{--bg:#e2edf4;--ink:#14222e;--muted:#55687a;--line:#c9dbe7;--panel:#f2f8fb;--accent:#1d6fa8;--err:#b3261e}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0e1a24;--ink:#e4eef5;--muted:#93a8b9;--line:#24384a;--panel:#15232f;--accent:#5cb6e6;--err:#f28b82}}
:root[data-theme="dark"]{--bg:#0e1a24;--ink:#e4eef5;--muted:#93a8b9;--line:#24384a;--panel:#15232f;--accent:#5cb6e6;--err:#f28b82}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,sans-serif;line-height:1.5}
main{max-width:48rem;margin:0 auto;padding:6vh max(16px,env(safe-area-inset-right,0px)) max(48px,env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
header{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;margin-bottom:16px}
h1{font-size:1.8rem;margin:0}
h1 a{color:var(--muted);text-decoration:none;font-size:1rem;font-weight:500}
h2{font-size:1.05rem;margin:0 0 10px}
.lede{color:var(--muted);margin:2px 0 0}.lede a{color:var(--accent)}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:visible;flex:none;margin-top:6px}
.seg button{font:inherit;font-size:.8rem;font-weight:600;border:0;background:transparent;color:var(--muted);padding:6px 10px;cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.seg .themeBtn{border-right:1px solid var(--line);min-width:2.4em;border-radius:7px 0 0 7px}
/* language: one frame with the current code, a menu drops from it */
.langdd{position:relative;display:inline-flex}
.langBtn{border-radius:0 7px 7px 0}.langBtn::after{content:'▾';margin-left:.3em;opacity:.65}
.langdd .menu{position:absolute;right:-1px;top:calc(100% + 5px);display:flex;flex-direction:column;min-width:8.5em;background:var(--panel);border:1px solid var(--line);border-radius:8px;overflow:hidden;box-shadow:0 6px 20px rgb(0 0 0/.18);z-index:30}
.langdd .menu[hidden]{display:none}
.langdd .menu button{text-align:left;padding:8px 14px;font-size:.85rem;font-weight:500;color:var(--ink);background:transparent;border:0;border-radius:0}
.langdd .menu button:hover{background:var(--line)}
.langdd .menu button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.panel{border:1px solid var(--line);border-radius:12px;background:var(--panel);padding:14px 16px;margin:0 0 14px;display:flex;flex-direction:column;gap:10px}
[hidden]{display:none!important}
label{display:flex;flex-direction:column;gap:4px;font-size:.85rem;color:var(--muted)}
/* the rule of Gygès chosen by the match's creator, told once to each player as the match begins */
.ov{position:fixed;inset:0;z-index:50;display:flex;align-items:center;justify-content:center;padding:16px;background:color-mix(in srgb,var(--bg) 60%,transparent);-webkit-backdrop-filter:blur(2px);backdrop-filter:blur(2px)}.ov[hidden]{display:none}.ov .panel{width:min(24rem,100%);margin:0;box-shadow:0 10px 32px rgba(0,0,0,.22)}.ov h2{margin:0}.ov p{margin:0}
label.toggle{flex-direction:row;align-items:center;gap:8px;color:var(--ink);cursor:pointer}label.toggle[hidden]{display:none}.toggle input{width:18px;height:18px;accent-color:var(--accent);flex:none;margin:0}
input,select{font:inherit;font-size:.95rem;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:8px 10px}
button{font:inherit;font-size:.95rem;color:var(--ink);background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:9px 12px;cursor:pointer}
button.primary{background:var(--ink);color:var(--bg);border-color:var(--ink);font-weight:600}
.row{display:flex;gap:8px;flex-wrap:wrap}.row > *{flex:1}
/* the match's games as the home page's cards, in table order: one column on a phone, two on a wide screen (2 × 2, or
   2 × 2 + 1 with the fifth centred); under each card its clock and rule, or its result */
.plan{list-style:none;margin:4px 0;padding:0;display:grid;grid-template-columns:1fr;gap:16px 14px}
@media (min-width:600px){.plan{grid-template-columns:repeat(4,1fr)}.plan li{grid-column:span 2}.plan li:last-child:nth-child(odd){grid-column:2/span 2}}
.plan .gm{margin:6px 2px 0;font-size:.9rem;color:var(--muted);display:flex;gap:8px;align-items:baseline}
.plan .gm b{flex:none;font-size:.78rem;font-weight:650;color:var(--ink);border:1px solid var(--line);border-radius:999px;padding:0 8px}
.hint{color:var(--muted);font-size:.85rem;margin:0}
.err{color:var(--err);font-size:.88rem;margin:0}
.big{font-size:1.25rem;font-weight:650;margin:0}
.link{display:flex;gap:6px}.link input{flex:1;min-width:0;font-size:.8rem}
.matches{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
.matches li{display:flex;justify-content:space-between;align-items:center;gap:10px;border-top:1px solid var(--line);padding-top:8px}
.matches .acts{display:flex;gap:6px;flex:none}
.matches li:first-child{border-top:0;padding-top:0}
/* an invitation (to play or to watch): the action first, in one block; the programme after it, one line per table */
.act h2{font-size:1.3rem;line-height:1.25;margin:0}
.act .who{color:var(--muted);margin:0}
.act .go{display:flex;gap:8px;align-items:flex-end}.act .go label{flex:1;min-width:0}
.act .go button{flex:none;font-size:1rem;padding:9px 22px}
@media (max-width:520px){.act .go{flex-direction:column;align-items:stretch}.act .go button{padding:11px 16px}}
.prog{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
.prog li{display:flex;align-items:center;gap:12px}
.prog .gc{width:68px;flex:none;border-radius:7px}.prog .gc .ct{display:none}
.prog .tx{display:flex;flex-direction:column;line-height:1.3;min-width:0}
.prog .tx b{font-weight:650}.prog .tx span{color:var(--muted);font-size:.85rem}
/* the match's tables as small cards, three then two (or two by two): the table, the clock and the rule written in the
   card, under the game's name; the picture narrowed to leave them room */
.mp{list-style:none;margin:2px 0;padding:0;display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.mp li{grid-column:span 2}.mp li:last-child:nth-child(odd){grid-column:2/span 2}
@media (min-width:600px){.mp:not(.two)[data-n="5"]{grid-template-columns:repeat(6,1fr)}.mp:not(.two)[data-n="5"] li:nth-child(4){grid-column:2/span 2}.mp:not(.two)[data-n="5"] li:nth-child(5){grid-column:4/span 2}}
.mp .gc{border-radius:10px}
.mp .gc .art,.mp .gc .bar{width:54%}@media (max-width:599px){.mp .gc .art,.mp .gc .bar{width:46%}}
.mp .gc .ct{font-size:11cqw}.mp .c-dblocks .ct{font-size:8.6cqw}
.mp .gi{position:absolute;left:6.5cqw;top:27cqw;z-index:3;display:flex;flex-direction:column;align-items:flex-start;gap:.15em;line-height:1.15;font-size:max(10px,5cqw);text-shadow:0 0 3px var(--gbg),0 0 3px var(--gbg)}
.mp .gi b{font-weight:700;font-size:.92em;color:var(--gbg);background:var(--gink);border-radius:999px;padding:.05em .55em;text-shadow:none}
.mp .gi span{font-weight:600}.mp .gi i{font-style:normal;opacity:.8}
/* home: three buttons, one under the other */
/* the page fills the window: the buttons in the middle of the space between the header and the picture, the picture at the bottom */
main:has(#vHome:not([hidden])){min-height:100vh;min-height:100svh;display:flex;flex-direction:column;padding-bottom:24px}
#vHome{flex:1;display:flex;flex-direction:column}
.hub{display:flex;flex-direction:column;gap:12px;width:100%;max-width:26rem;margin:auto;padding:28px 0}
.logo{display:block;width:100%;max-width:26rem;margin:0 auto}   /* as wide as the buttons */.logo img{display:block;width:100%;height:auto;border-radius:10px}
a.hb{display:block;text-align:center;font-weight:600;font-size:1.05rem;padding:14px 16px;border:1px solid var(--line);border-radius:10px;background:var(--panel);color:var(--ink);text-decoration:none}
a.hb:hover,a.hb:focus-visible{border-color:var(--accent);outline:none}
a.hb.primary{background:var(--ink);color:var(--bg);border-color:var(--ink)}a.hb.primary:hover{background:var(--accent);border-color:var(--accent)}
/* a match in a list: who and the score on the first line, the details under it */
.matches li{flex-wrap:wrap}.matches .mi{display:flex;flex-direction:column;min-width:0;flex:1 1 15rem;line-height:1.35}
.matches .mi b{font-weight:650}.matches .mi span{color:var(--muted);font-size:.85rem}
h2 .n{color:var(--muted);font-weight:500}
.crumb{margin:0 0 10px;font-size:.9rem}.crumb a{color:var(--muted);text-decoration:none}.crumb a:hover{color:var(--ink)}
/* a new match: two frames, one under the other; on a wide screen the settings on the left, the tables on the right */
.nf{display:flex;flex-direction:column}
@media (min-width:860px){main:has(#vNew:not([hidden])){max-width:62rem}
  .nf{display:grid;grid-template-columns:minmax(16rem,21rem) 1fr;gap:14px;align-items:start}}
.nf .primary{margin-top:4px}
/* la coquille: the whole match in this page, the table's game in a frame over the whole window (inside the safe area,
   in the game's own background), a screen between two tables, and a voice bar when no game is on screen */
body.playing{overflow:hidden}body.playing main{display:none}
#vPlay{position:fixed;inset:0;padding:env(safe-area-inset-top,0px) env(safe-area-inset-right,0px) env(safe-area-inset-bottom,0px) env(safe-area-inset-left,0px);background:var(--bg)}
#vPlay iframe{display:block;width:100%;height:100%;border:0}
.pass{position:absolute;inset:0;z-index:2;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;padding:16px;text-align:center;background:var(--bg)}
.pass .pk{margin:0;font-size:.85rem;font-weight:650;border:1px solid var(--line);border-radius:999px;padding:0 10px}.pass .gc{width:min(14rem,60vw);margin:10px 0}
.vpill{position:fixed;z-index:60;left:50%;bottom:max(16px,env(safe-area-inset-bottom,0px));transform:translateX(-50%);display:flex;align-items:center;gap:8px;max-width:calc(100% - 32px);
  background:var(--panel);border:1px solid var(--line);border-radius:999px;padding:6px 6px 6px 14px;box-shadow:0 6px 20px rgb(0 0 0/.18);font-size:.9rem}
body:has(#vPill:not([hidden])) main{padding-bottom:96px}
.vpill[hidden]{display:none}.vpill span{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.vpill button{flex:none;padding:5px 12px;border-radius:999px;font-size:.85rem}
</style>
</head>
<body>
<main>
<header><div><h1><a href="index.html">games /</a> Mochalunt</h1><p class="lede"><span data-i18n="lede"></span> <span data-i18n="more"></span> <a href="https://www.abstrakta.info/mochalunt-2026.html" target="_blank" rel="noopener">Mochalunt</a></p></div>
<div class="seg" role="group" aria-label="Langue / Language"><div class="langdd"><button type="button" class="langBtn" aria-haspopup="menu" aria-expanded="false">FR</button><div class="menu" role="menu" hidden><button type="button" role="menuitem" data-lang="fr">Français</button><button type="button" role="menuitem" data-lang="en">English</button><button type="button" role="menuitem" data-lang="es">Español</button></div></div></div></header>

<!-- home: three ways in -->
<section id="vHome">
  <nav class="hub">
    <a class="hb primary" href="#new" data-i18n="newT"></a>
    <a class="hb" href="#resume" data-i18n="hRes"></a>
    <a class="hb" href="#mine" data-i18n="mine"></a>
  </nav>
  <a class="logo" href="https://www.abstrakta.info/mochalunt-2026.html" target="_blank" rel="noopener"><img src="img/mochalunt-2026.webp" alt="Mochalunt 2026" width="1844" height="1154"></a>
</section>

<!-- the interrupted matches -->
<section id="vResume" hidden>
  <p class="crumb"><a href="#">← Mochalunt</a></p>
  <div class="panel"><h2 data-i18n="hRes"></h2><ul class="matches" id="resumeList"></ul><p class="hint" id="resumeNone" data-i18n="noRes"></p></div>
</section>

<!-- all the matches of this device -->
<section id="vMine" hidden>
  <p class="crumb"><a href="#">← Mochalunt</a></p>
  <div class="panel"><h2 data-i18n="mine"></h2><ul class="matches" id="mineList"></ul><p class="hint" id="mineNone" data-i18n="noMine"></p>
    <p class="hint" data-i18n="mineHint"></p></div>
</section>

<!-- a new match: the settings on the left, the tables on the right -->
<section id="vNew" hidden>
  <p class="crumb"><a href="#">← Mochalunt</a></p>
  <div class="nf">
  <form class="panel" id="newForm">
    <h2 data-i18n="newT"></h2>
    <div class="row"><label><span data-i18n="year"></span><select id="nYear"></select></label><label><span data-i18n="round"></span><select id="nRound"></select></label></div>
    <label><span data-i18n="name"></span><input id="nName" maxlength="24" autocomplete="nickname"></label>
    <label><span data-i18n="j1"></span><select id="nJ1"><option value="c" data-i18n="j1Me"></option><option value="i" data-i18n="j1Opp"></option><option value="rnd" data-i18n="j1Rnd"></option></select></label>
    <label><span data-i18n="fmt"></span><select id="nFmt"><option value="all" data-i18n="fmtAll"></option><option value="team" data-i18n="fmtTeam"></option></select></label>
    <label id="nExclW" hidden><span data-i18n="excl"></span><select id="nExcl"></select></label>
    <label class="toggle" id="nBackW"><input type="checkbox" id="nNoBack" checked> <span data-i18n="noBack"></span></label>
    <p class="hint" id="nHint"></p>
    <p class="err" id="nErr" hidden></p>
    <button class="primary" type="submit" data-i18n="create"></button>
  </form>
  <div class="panel"><h2 data-i18n="tables"></h2><ol class="mp two" id="nPlan"></ol></div>
  </div>
</section>

<!-- the match just created: the links to send -->
<section id="vMade" hidden>
  <p class="crumb"><a href="#">← Mochalunt</a></p>
  <div class="panel">
    <h2><span data-i18n="madeT"></span> <span class="n" id="madeEd"></span></h2>
    <p class="hint" id="madeJ1"></p>
    <p class="hint" data-i18n="savedNote"></p>
    <label><span data-i18n="invLink"></span><span class="link"><input id="invLink" readonly><button type="button" data-copy="invLink" data-i18n="copy"></button></span></label>
    <label><span data-i18n="watchLink"></span><span class="link"><input id="watchLink" readonly><button type="button" data-copy="watchLink" data-i18n="copy"></button></span></label>
    <ol class="mp" id="madePlan"></ol>
    <button class="primary" type="button" id="madeGo" data-i18n="goFirst"></button>
  </div>
</section>

<!-- an invitation -->
<section id="vJoin" hidden>
  <form class="panel act" id="joinForm">
    <h2 id="joinT"></h2>
    <p class="who" id="joinWho"></p>
    <div class="go"><label><span data-i18n="name"></span><input id="jName" maxlength="24" autocomplete="nickname" enterkeyhint="go"></label>
      <button class="primary" type="submit" data-i18n="joinBtn"></button></div>
    <p class="err" id="jErr" hidden></p>
    <p class="hint" id="joinMsg" hidden></p>
    <div class="row" id="joinActs" hidden><button type="button" class="primary" id="joinFirst" data-i18n="goFirst"></button><button type="button" id="joinRetry" data-i18n="retry"></button></div>
  </form>
  <div class="panel"><h2 data-i18n="prog"></h2><ol class="prog" id="joinPlan"></ol></div>
</section>

<!-- a spectator: looking for the table in play -->
<section id="vWatch" hidden>
  <form class="panel act" id="watchForm">
    <h2 id="watchT"></h2>
    <p class="who" id="watchWho"></p>
    <div class="go" id="watchGo"><label><span data-i18n="nameOpt"></span><input id="wName" maxlength="24" autocomplete="nickname" enterkeyhint="go"></label>
      <button class="primary" type="submit" data-i18n="watchBtn"></button></div>
    <p class="hint" id="watchMsg" hidden></p><button type="button" id="watchRetry" data-i18n="retry" hidden></button>
  </form>
  <div class="panel"><h2 data-i18n="prog"></h2><ol class="prog" id="watchPlan"></ol></div>
</section>

<!-- the result -->
<section id="vRes" hidden>
  <p class="crumb"><a href="#">← Mochalunt</a></p>
  <div class="panel"><h2><span data-i18n="resT"></span> <span class="n" id="resEd"></span></h2><p class="big" id="resLine"></p><ol class="plan" id="resList"></ol>
    <button type="button" class="primary" id="resGo" hidden></button></div>
</section>
<p class="err" id="err"></p>
</main>
<section id="vPlay" hidden><div class="pass" id="pass"><p class="pk" id="passK"></p><div id="passC"></div><p class="hint" id="passS"></p><p class="hint" id="passL" data-i18n="passL"></p></div></section>
<div class="vpill" id="vPill" role="status" hidden><span id="vpTxt"></span><button type="button" id="vpB"></button><button type="button" class="primary" id="vpA"></button></div>
<div class="ov" id="backOv" hidden><div class="panel" role="dialog" aria-modal="true" aria-labelledby="backT"><h2 id="backT" data-i18n="backT"></h2><p id="backTxt"></p><p class="hint" id="backBy"></p><button class="primary" type="button" id="backOk" data-i18n="backOk"></button></div></div>
<script>
'use strict';
// The match: the plan below, the record kept on each device under mochalunt-<code> (see common/core.js, « Mochalunt

const MOCHA=[{id:'arimaa',page:'arimaa',name:'Arimaa',cls:'arimaa',tc:'20 min + 30 s'},{id:'dblk',page:'diagonalblocks',name:'Diagonal Blocks',cls:'dblocks',card:'Diagonal Blocks',tc:'20 min + 10 s',note:'swap'},
  {id:'volo',page:'volo',name:'Volo',cls:'volo',tc:'20 min + 20 s'},{id:'gyges',page:'gyges',name:'Gygès',cls:'gyges',tc:'20 min + 10 s',note:'adv'},{id:'tintas',page:'tintas',name:'Tintas',cls:'tintas',tc:'20 min + 10 s'}];

  $('backTxt').textContent=t(rec.gyb?'backYes':'backNo');const n=rec.names&&rec.names.c;

  create:"Créer le match",noBack:"Gygès : interdire les coups qui ramènent à la position d'origine",backT:"Gygès : la règle de ce match",backNo:"Les coups qui ramènent à la position d'origine sont interdits.",backYes:"Les coups qui ramènent à la position d'origine sont autorisés.",backBy:"Choix de {n}, qui a créé le match.",backMe:"C'est votre choix, à la création du match.",backOk:"Compris",madeT:"Match créé",invLink:"Lien d'invitation, à envoyer à votre adversaire",
  watchLink:"Lien pour les observateurs",copy:"Copier",copied:"Copié",goFirst:"Aller à la première table",joinT:"Vous êtes invité à un match Mochalunt",joinTn:"{n} vous invite à un match Mochalunt",watchTn:"{n} vous invite à suivre un match Mochalunt",joinWho:"{g} jeux · vous choisissez votre place aux tables {t}",watchWho:"{g} jeux, une table par jeu",and:" et ",prog:"Le programme",watchBtn:"Suivre le match",nameOpt:"Votre nom (facultatif : sans nom, vous restez anonyme)",joinBtn:"Rejoindre le match",
  watchT:"Suivre un match Mochalunt",watchFind:"Recherche de la table en cours…",watchNone:"Aucune table n'est ouverte pour l'instant : les joueurs ne sont pas encore à une table.",retry:"Réessayer",

// the link's tail: the game left out ('a': none), the match's Player 1 ('c' the creator, 'i' the invitee), then the year

const tail=rec=>(rec.excl<0?'a':String(rec.excl))+rec.j1+(/^\d{4}-\d+$/.test(rec.ed||'')?rec.ed.replace('-','r'):'')+(rec.gyb?'b':'');   // b: Gygès with the moves back allowed (the creator's choice)

// ---------- home ----------
// the matches of this device where I play and that have begun, the latest first; a match never begun is not listed
// (its record stays for its tables and its links, a week at most)
function myRecs(){const recs=[],old=[];for(let i=0;i<localStorage.length;i++){const k=localStorage.key(i);if(k&&k.startsWith('mochalunt-')){const r=LS.get(k,null);
    if(r&&r.me&&r.excl!==undefined){if(begun(r))recs.push(r);else if(Date.now()-(r.at||0)>6048e5)old.push(r);}}}
  old.forEach(forget);return recs.sort((a,b)=>(b.at||0)-(a.at||0));}
// begun: both players have been at a table together (on, noted by the table: common/core.js); older records: a table
// played, or at least two moves at the table in play (saved by its page, as host or as guest)
function begun(r){if(r.on||Object.keys(r.res||{}).length)return true;const P=plan(r.excl),k=nextK(r);if(k>=P.length)return true;
  const tc=r.code+'t'+k,h=LS.get(P[k].id+'-p2p-host',null),g=LS.get(P[k].id+'-p2p-guest',null);
  return !!(h&&h.code===tc&&h.game&&(h.game.moves||[]).length>=2||g&&g.code===tc&&g.view&&(g.view.moves||[]).length>=2);}
const interrupted=r=>nextK(r)<plan(r.excl).length&&begun(r);

// dates in the page's language; the match's start (t0; older records: their last save)
const loc=()=>lang==='fr'?'fr-FR':lang==='es'?'es-ES':'en-GB';

const fWhen=x=>new Intl.DateTimeFormat(loc(),{day:'numeric',month:'long',year:'numeric',hour:'2-digit',minute:'2-digit'}).format(new Date(x));
const edOf=r=>{const m=/^(\d{4})-(\d+)$/.exec(r.ed||'');return m?{y:+m[1],r:+m[2]}:EDITIONS[0];};

  for(const r of recs){const P=plan(r.excl),k=nextK(r),sc=score(r),e=edOf(r),li=document.createElement('li'),mi=document.createElement('span'),b0=document.createElement('b'),d0=document.createElement('span');
    mi.className='mi';b0.textContent=t('vs',{n:nameOf(r,other(r.me))})+' · '+num(sc[r.me])+'–'+num(sc[other(r.me)]);
    const st=k<P.length?t('tableN',{k:k+1,n:P.length})+' · '+P[k].name:t('over');
    d0.textContent=all?[fDate(r.t0||r.at),t('ed',{y:e.y,r:e.r}),st].join(' · '):[t('started',{d:fWhen(r.t0||r.at)}),t('ed',{y:e.y,r:e.r}),st].join(' · ');mi.append(b0,d0);

      btn(t('del'),'',()=>{if(!confirm(t('delQ',{n:nameOf(r,other(r.me))})))return;forget(r);mine();});}

// ---------- an invitation ----------

// none open, the page says why (not begun yet, or begun elsewhere and both gone) and offers the first table or Retry.
function join(code,x,wcode,host){const p=parseTail(x);if(!p){home();$('err').textContent=t('bad');return;}

  show('vJoin');const P=plan(p.excl),mine=P.map((g,k)=>k).filter(k=>(k%2===0?p.j1:other(p.j1))==='i').map(k=>k+1);   // the tables where I choose my seat

  $('joinWho').textContent=(p.ed?(e=>t('ed',{y:e.y,r:e.r})+' · ')(edOf(p)):'')+t('joinWho',{g:P.length,t:listAnd(mine)});
  progList($('joinPlan'),p.excl);$('jName').value=old&&old.name||LS.get('games-name','');

  $('joinForm').onsubmit=e=>{e.preventDefault();const nm=needName($('jName'),'jErr');if(!nm)return;LS.set('games-name',nm);
    const rec=old&&old.me?{...old,name:nm,names:{...old.names,i:nm}}:{code,wcode:wcode||null,ed:p.ed||undefined,excl:p.excl,j1:p.j1,gyb:p.gyb,me:'i',pid:rnd(16),name:nm,names:host?{c:host,i:nm}:{i:nm},res:{},at:Date.now(),t0:Date.now()};

function joinSeek(rec){const msg=$('joinMsg');msg.hidden=false;msg.textContent=t('joinFind');$('joinActs').hidden=true;
  if(typeof Peer==='undefined'){msg.textContent=t('noPeer');return;}
  seekTable(rec,k=>{goTo(tableUrl(rec,k,'t'));},()=>{msg.textContent=t('joinNone');$('joinActs').hidden=false;
    $('joinFirst').onclick=()=>{goTo(tableUrl(rec,0,'t'));};$('joinRetry').onclick=()=>joinSeek(rec);});}

// ---------- a spectator: the open table, from the last one back ----------
function watch(code,x,host){const p=parseTail(x);if(!p){home();$('err').textContent=t('bad');return;}
  let rec=recOf(code);if(!rec){rec={code,ed:p.ed||undefined,excl:p.excl,j1:p.j1,gyb:p.gyb,me:null,res:{},names:{}};LS.set('mochalunt-'+code,rec);}
  else if(p.ed&&!rec.ed){rec.ed=p.ed;LS.set('mochalunt-'+code,rec);}
  show('vWatch');$('watchT').textContent=host?t('watchTn',{n:host}):t('watchT');
  $('watchWho').textContent=(rec.ed?(e=>t('ed',{y:e.y,r:e.r})+' · ')(edOf(rec)):'')+t('watchWho',{g:plan(rec.excl).length});
  progList($('watchPlan'),rec.excl);$('watchGo').hidden=false;$('watchMsg').hidden=true;$('watchRetry').hidden=true;
  $('wName').value=typeof rec.wname==='string'?rec.wname:LS.get('games-name','');
  // the name the players will see (empty: anonymous), kept with the match: its tables take it (common/core.js)
  $('watchForm').onsubmit=e=>{e.preventDefault();const nm=$('wName').value.trim().slice(0,24);rec.wname=nm;if(nm)LS.set('games-name',nm);LS.set('mochalunt-'+code,rec);
    $('watchGo').hidden=true;findTable(code,rec);};}
function findTable(code,rec){$('watchMsg').hidden=false;$('watchMsg').textContent=t('watchFind');$('watchRetry').hidden=true;
  if(typeof Peer==='undefined'){$('watchMsg').textContent=t('noPeer');return;}
  seekTable(rec,k=>{goTo(tableUrl(rec,k,'w'));},()=>{$('watchMsg').textContent=t('watchNone');$('watchRetry').hidden=false;$('watchRetry').onclick=()=>findTable(code,rec);});}
// the open table of a match (its host's id: <game>-p2p-<code>t<k>), from the last one back: found(k) or none()
function seekTable(rec,found,none){const P=plan(rec.excl),me=new Peer({debug:0});let k=P.length-1,done=false,to=null;
  const next=()=>{if(done)return;clearTimeout(to);if(k<0){done=true;try{me.destroy();}catch(e){}none();return;}
    const kk=k--,c=me.connect(P[kk].id+'-p2p-'+rec.code+'t'+kk,{reliable:true});to=setTimeout(()=>{try{c.close();}catch(e){}next();},5000);
    c.on('open',()=>{if(done)return;clearTimeout(to);done=true;try{c.close();me.destroy();}catch(e){}found(kk);});};
  me.on('open',next);me.on('error',e=>{if(e.type==='peer-unavailable')next();else if(!me.open&&!done){done=true;none();}});}

// ---------- the result ----------
function result(code){const rec=recOf(code);if(!rec||rec.excl===undefined){home();$('err').textContent=t('unknown');return;}
  show('vRes');const P=plan(rec.excl),sc=score(rec),a=rec.j1,b=other(a),k=nextK(rec);
  $('resEd').textContent=rec.me||rec.ed?(e=>'· '+t('ed',{y:e.y,r:e.r}))(edOf(rec)):'';   // a spectator's record from an older link: not known
  const A=nameOf(rec,a),B=nameOf(rec,b);
  $('resLine').textContent=k<P.length?t('sofar',{a:A,x:num(sc[a]),y:num(sc[b]),b:B}):sc[a]===sc[b]?t('tie',{x:num(sc[a]),y:num(sc[b])}):
    sc[a]>sc[b]?t('wins',{n:A,x:num(sc[a]),y:num(sc[b])}):t('wins',{n:B,x:num(sc[b]),y:num(sc[a])});
  const ol=$('resList');ol.innerHTML='';P.forEach((g,i)=>{const res=rec.res[i],href=res?g.page+'.html#mv-'+code+'-'+i:null;   // a played table: its game to look at
    ol.appendChild(gameCard(g,i,res?(res.w==='d'?t('drawn'):t('won',{n:res.names&&res.names[res.w]||nameOf(rec,res.w)})):t('live'),href));});
  $('resGo').hidden=k>=P.length;if(k<P.length){$('resGo').textContent=t('resume');$('resGo').onclick=()=>{goTo(tableUrl(rec,k,rec.me?'t':'w'));};}}

// ---------- la coquille: the whole match in this page ----------
// From the first table to the result the page stays open: each table's game is its own page in a frame
// (<page>.html?coquille#m<t|w>-<code>-<k>; common/core.js, « La coquille »), changed in place from one table to the
// next (no history entry: Back does not return to the table before). This page keeps what goes on across the tables:
// a link between the two players (PeerJS, mochalunt-<code>-c listens, mochalunt-<code>-i calls it, one-second
// heartbeats), the voice (the microphone and the call are here, so a new table cuts neither) and the way from one table
// to the next. A table opened on its own (an older link) comes here (<page>.html#mt-… → mochalunt.html#mt-…~<page>).
const PAGES=MOCHA.map(g=>g.page),ORG=location.origin&&location.origin!=='null'?location.origin:'*';
const CQ={code:null,kind:'',k:-1,page:'',fr:null,peer:null,conn:null,pend:null,last:0,tries:0,me:null,other:''};
let SV={st:'off',note:''};   // the voice: off | out (offered) | in (offered to me) | conn (accepted, connecting) | on
const coqTo=m=>{const w=CQ.fr&&CQ.fr.contentWindow;if(w)try{w.postMessage({coq:2,...m},ORG);}catch(e){}};
function play(kind,code,k,hint){let rec=recOf(code);
  if(!rec&&kind==='w'){rec={code,me:null,res:{},names:{}};LS.set('mochalunt-'+code,rec);}
  if(!rec||kind==='t'&&!rec.me){home();$('err').textContent=t('unknown');return;}
  const P=rec.excl===undefined?null:plan(rec.excl);
  if(P&&k>=P.length){history.replaceState(null,'','#res-'+code);result(code);return;}
  const page=P?P[k].page:PAGES.includes(hint)?hint:null;if(!page){home();$('err').textContent=t('bad');return;}
  if(CQ.code&&CQ.code!==code){linkStop();svStop('',true);}
  CQ.code=code;CQ.kind=kind;show('vPlay');document.body.classList.add('playing');
  history.replaceState(null,'','#m'+kind+'-'+code+'-'+k+(P?'':'~'+page));
  if(kind==='t')linkStart(rec);
  if(CQ.fr&&CQ.k===k&&CQ.page===page)return;
  CQ.k=k;CQ.page=page;passShow(rec,k,page);
  const url=page+'.html?coquille#m'+kind+'-'+code+'-'+k;
  if(!CQ.fr){const f=document.createElement('iframe');f.allow='clipboard-write; autoplay; fullscreen';f.src=url;$('vPlay').appendChild(f);CQ.fr=f;
    f.addEventListener('load',()=>{coqBg();setTimeout(passHide,4000);});}   // (ready, from the game, hides it sooner)
  else try{CQ.fr.contentWindow.location.replace(url);}catch(e){CQ.fr.src=url;}
  svPush();}
// between two tables: the table, the game's card, the score
function passShow(rec,k,page){const P=rec.excl===undefined?null:plan(rec.excl),g=MOCHA.find(x=>x.page===page);$('pass').hidden=false;
  $('passK').textContent=P?t('tableN',{k:k+1,n:P.length}):t('table',{k:k+1});
  const c=$('passC');c.innerHTML='';if(g){const d=document.createElement('div');d.className='gc c-'+g.cls;const ct=document.createElement('span');ct.className='ct';ct.textContent=g.card||g.name;d.append(ct);
    for(const x of ['bar','art']){const e=document.createElement('span');e.className=x;d.append(e);}c.append(d);}
  const sc=score(rec),a=rec.j1||'c',b=other(a);$('passS').textContent=Object.keys(rec.res||{}).length?t('sofar',{a:nameOf(rec,a),x:num(sc[a]),y:num(sc[b]),b:nameOf(rec,b)}):'';}
function passHide(){$('pass').hidden=true;}
function coqFrameOff(){if(!CQ.fr)return;try{CQ.fr.remove();}catch(e){}CQ.fr=null;CQ.k=-1;CQ.page='';document.title='Mochalunt';svPush();}
// the frame's surroundings (the safe area of a phone) in the game's own background
function coqBg(){try{$('vPlay').style.background=getComputedStyle(CQ.fr.contentDocument.body).backgroundColor;}catch(e){}}
addEventListener('message',e=>{if(!CQ.fr||e.source!==CQ.fr.contentWindow||!e.data||e.data.coq!==1)return;const d=e.data;
  if(d.t==='ready'){passHide();coqBg();if(d.title)document.title=d.title;svPush();try{CQ.fr.contentWindow.focus();}catch(x){}}
  else if(d.t==='go'){const k=+d.k;if(Number.isInteger(k)&&k>=0)play(CQ.kind,CQ.code,k);}
  else if(d.t==='leave')location.href=location.pathname;
  else if(d.t==='voice')svOp(d.op,d.v);});
// the language or the theme changed in the game: this page follows
addEventListener('storage',e=>{if(e.key==='games-lang'){const l=LS.get('games-lang',lang);if(l!==lang&&I18N[l]){lang=l;texts();pillRender();}}else if(e.key==='games-theme')setTimeout(coqBg,80);});

// the link between the two players
const linkUp=()=>!!(CQ.conn&&CQ.conn.open);
const linkSend=m=>{try{if(linkUp())CQ.conn.send(m);}catch(e){}};
function linkStart(rec){if(CQ.peer||!rec.me||typeof Peer==='undefined')return;CQ.me=rec.me;CQ.other='mochalunt-'+rec.code+'-'+other(rec.me);
  const p=new Peer('mochalunt-'+rec.code+'-'+rec.me,{debug:0});CQ.peer=p;
  p.on('open',()=>{CQ.tries=0;linkDial();});
  p.on('connection',c=>{if(c.peer!==CQ.other){try{c.close();}catch(e){}return;}linkAdopt(c);});
  p.on('call',svIncoming);
  p.on('disconnected',()=>{if(CQ.peer===p)setTimeout(()=>{try{if(CQ.peer===p&&!p.destroyed)p.reconnect();}catch(e){}},1000);});
  // the id still held (this page just reloaded, the server has not let it go yet; or the match open in another tab): again
  p.on('error',e=>{if(CQ.peer!==p||e.type!=='unavailable-id')return;try{p.destroy();}catch(x){}CQ.peer=null;
    if(++CQ.tries<60)setTimeout(()=>{const r=recOf(CQ.code);if(r&&r.me&&!CQ.peer)linkStart(r);},3000);});}
function linkDial(){if(CQ.me!=='i'||!CQ.peer||!CQ.peer.open||linkUp()||CQ.pend)return;const c=CQ.peer.connect(CQ.other,{reliable:true});CQ.pend=c;linkAdopt(c);
  setTimeout(()=>{if(CQ.pend===c){CQ.pend=null;if(!c.open)try{c.close();}catch(e){}}},5000);}
function linkAdopt(c){c.on('open',()=>{if(CQ.pend===c)CQ.pend=null;if(CQ.conn&&CQ.conn!==c)try{CQ.conn.close();}catch(e){}CQ.conn=c;CQ.last=Date.now();svPush();svAuto();});
  c.on('data',d=>{if(c!==CQ.conn||!d)return;CQ.last=Date.now();if(d.t==='voice')svOnMsg(d.op);});
  c.on('close',()=>{if(CQ.conn===c){CQ.conn=null;svLinkLost();}});c.on('error',()=>{});}
function linkStop(){try{CQ.peer&&CQ.peer.destroy();}catch(e){}CQ.peer=CQ.conn=CQ.pend=null;CQ.me=null;}
setInterval(()=>{if(linkUp()){linkSend({t:'ping'});if(Date.now()-CQ.last>6000){const c=CQ.conn;CQ.conn=null;try{c.close();}catch(e){}svLinkLost();}}else linkDial();
  if(SV.st==='on'&&Date.now()-((recOf(CQ.code)||{}).svc||{at:0}).at>30e3)svFresh(true);},1000);

// The voice, between the two players: one offers (ask), the other accepts (yes) or declines (no); each then takes its
// microphone, kept for the whole call whatever the tables; the invitee's page (i) places the media call once both have
// theirs (go). On, the call is noted in the match's record (svc); this page reloaded within 15 min, it is offered again
// (reask) and taken by itself. Hanging up, declining or a bye removes the note, and lets the microphone go.
const svOther=()=>{const r=recOf(CQ.code);return r?nameOf(r,other(r.me)):t('opp');};
const svCaller=()=>CQ.me==='i';
function svFresh(on){const r=recOf(CQ.code);if(!r)return;if(on)r.svc={at:Date.now()};else if(r.svc)delete r.svc;else return;LS.set('mochalunt-'+r.code,r);}
const svIsFresh=()=>{const r=recOf(CQ.code);return !!(r&&r.svc&&Date.now()-r.svc.at<15*60e3);};
function svPush(){const r=recOf(CQ.code)||{};coqTo({t:'voice',st:SV.st,note:SV.note,muted:!!SV.muted,mic:!!SV.stream,link:linkUp(),
  ok:!!(r.me&&CQ.kind==='t'&&navigator.mediaDevices&&navigator.mediaDevices.getUserMedia&&typeof Peer!=='undefined')});pillRender();}
function svOp(op,v){if(op==='ask'){if(SV.st!=='off'||!linkUp())return;SV={st:'out',note:''};linkSend({t:'voice',op:'ask'});svPush();}
  else if(op==='cancel'){if(SV.st!=='out')return;linkSend({t:'voice',op:'cancel'});SV={st:'off',note:''};svPush();}
  else if(op==='yes'||op==='no')svAnswer(op==='yes');
  else if(op==='hang'){svStop('vEnd',true);svFresh(false);}
  else if(op==='mute'){if(!SV.stream)return;SV.muted=!SV.muted;SV.stream.getAudioTracks().forEach(k=>{k.enabled=!SV.muted;});svPush();}
  else if(op==='vol'&&typeof v==='number'&&SV.audio)SV.audio.volume=Math.max(0,Math.min(1,v/100));}
function svMic(){return navigator.mediaDevices.getUserMedia({audio:{echoCancellation:true,noiseSuppression:true}}).then(st=>{
  if(SV.st!=='conn'){st.getTracks().forEach(k=>k.stop());return null;}SV.stream=st;SV.muted=false;return st;});}
function svWait(){clearTimeout(SV.to);SV.to=setTimeout(()=>{if(SV.st==='conn')svStop('vFail',true);},15000);}
function svConnect(){svWait();if(svCaller()&&CQ.peer&&SV.stream)svCall(CQ.peer.call(CQ.other,SV.stream));}
function svAnswer(yes){if(SV.st!=='in')return;if(!yes){svFresh(false);linkSend({t:'voice',op:'no'});SV={st:'off',note:''};svPush();return;}
  SV.st='conn';svPush();svMic().then(st=>{if(!st)return;linkSend({t:'voice',op:'yes'});svWait();svPush();},()=>svStop('vMic',true));}   // then the call (or go)
function svOnMsg(op){
  if(op==='ask'||op==='reask'){if(SV.st==='out'&&CQ.me==='i')SV={st:'off',note:''};   // both offered at once: the creator's offer stands
    if(SV.st!=='off')return;SV={st:'in',note:''};if(op==='reask'&&svIsFresh()){svAnswer(true);return;}coqTo({t:'ring'});svPush();}
  else if(op==='cancel'&&SV.st==='in'){SV={st:'off',note:''};svPush();}
  else if(op==='no'&&SV.st==='out'){svFresh(false);SV={st:'off',note:'vNo'};svPush();}
  else if(op==='yes'&&SV.st==='out'){SV.st='conn';svPush();svMic().then(st=>{if(!st)return;if(svCaller())svConnect();else{linkSend({t:'voice',op:'go'});svWait();}svPush();},()=>svStop('vMic',true));}
  else if(op==='go'&&SV.st==='conn'&&SV.stream)svConnect();
  else if(op==='bye'){if(SV.st!=='off')svStop('vEnd',false);svFresh(false);}}
function svCall(c){SV.call=c;c.on('stream',rs=>{if(SV.call!==c)return;clearTimeout(SV.to);
    if(!SV.audio){const a=document.createElement('audio');a.autoplay=true;a.setAttribute('playsinline','');a.hidden=true;document.body.appendChild(a);SV.audio=a;}
    SV.audio.srcObject=rs;const v=LS.get('games-voicevol',80);SV.audio.volume=(typeof v==='number'?v:80)/100;const pl=SV.audio.play&&SV.audio.play();
    if(pl&&pl.catch)pl.catch(()=>{const f=()=>{if(SV.audio&&SV.audio.paused)SV.audio.play().catch(()=>{});};document.addEventListener('pointerdown',f,{once:true});document.addEventListener('keydown',f,{once:true});});
    SV.st='on';svFresh(true);svPush();});
  c.on('close',()=>{if(SV.call===c)svStop('vEnd',false);});c.on('error',()=>{if(SV.call===c)svStop('vFail',true);});}
function svIncoming(c){if(c.peer!==CQ.other||SV.st!=='conn'||!SV.stream){try{c.close();}catch(e){}return;}c.answer(SV.stream);svCall(c);}
function svStop(note,tell){const v=SV;if(v.st==='on')svFresh(true);if(tell&&v.st!=='off')linkSend({t:'voice',op:'bye'});clearTimeout(v.to);
  try{v.call&&v.call.close();}catch(e){}try{v.stream&&v.stream.getTracks().forEach(k=>k.stop());}catch(e){}
  if(v.audio){try{v.audio.srcObject=null;v.audio.remove();}catch(e){}}SV={st:'off',note:note||''};svPush();}
// the link lost: an offer goes; a call goes on by itself (its own connection)
function svLinkLost(){if(SV.st==='out'||SV.st==='in')SV={st:'off',note:''};svPush();}
function svAuto(){if(CQ.me==='i'&&SV.st==='off'&&svIsFresh()){SV={st:'out',note:''};linkSend({t:'voice',op:'reask'});svPush();}}
// no game on screen (the result, the match's pages): the call in a bar at the bottom
let pillNote=null;
function pillRender(){const b=$('vPill');if(!b)return;const st=SV.st,show=!CQ.fr&&(st!=='off'||!!SV.note);b.hidden=!show;if(!show)return;const n=svOther();
  $('vpTxt').textContent=st==='out'?t('vOut',{n}):st==='in'?t('vIn',{n}):st==='conn'?t('vConn'):st==='on'?t('vOn',{n}):t(SV.note,{n});
  const A=$('vpA'),B=$('vpB');A.hidden=B.hidden=false;B.disabled=false;B.title='';
  if(st==='in'){A.textContent=t('vYes');A.onclick=()=>svAnswer(true);B.textContent=t('vNo2');B.onclick=()=>svAnswer(false);}
  else if(st==='out'){A.hidden=true;B.textContent=t('vCancel');B.onclick=()=>svOp('cancel');}
  else if(st==='conn'||st==='on'){A.textContent=t('vHang');A.onclick=()=>svOp('hang');B.textContent=SV.muted?'🔇':'🎙';B.title=t(SV.muted?'vUnmute':'vMute');B.setAttribute('aria-label',B.title);B.onclick=()=>svOp('mute');B.disabled=!SV.stream;}
  else{A.hidden=B.hidden=true;clearTimeout(pillNote);pillNote=setTimeout(()=>{if(SV.st==='off'){SV.note='';pillRender();}},5000);}}

// ---------- start ----------
function texts(){document.documentElement.lang=lang;document.querySelectorAll('[data-i18n]').forEach(e=>e.textContent=t(e.dataset.i18n));
  document.querySelectorAll('[data-lang]').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.lang===lang)));}
const hostOf=x=>{try{return x?decodeURIComponent(x).trim().slice(0,24):'';}catch(e){return '';}};
function route(){const h=location.hash;let m;
  // the codes have their own lengths (6 the match's, 8 the spectators'): a link cut short is said to be invalid
  if((m=/^#join-([a-z0-9]{6})-([a-z0-9]+)(?:-([a-z0-9]{8}))?(?:~(.*))?$/.exec(h)))join(m[1],m[2],m[3],hostOf(m[4]));
  else if((m=/^#watch-([a-z0-9]{8})-([a-z0-9]+)(?:~(.*))?$/.exec(h)))watch(m[1],m[2],hostOf(m[3]));
  else if(/^#(join|watch)-/.test(h)){home();$('err').textContent=t('bad');}
  else if((m=/^#m([tw])-([a-z0-9]+)-(\d+)(?:~([a-z]+))?$/.exec(h)))play(m[1],m[2],+m[3],m[4]);
  else if((m=/^#res-([a-z0-9]+)$/.exec(h)))result(m[1]);
  else if((m=/^#made-([a-z0-9]+)$/.exec(h))&&recOf(m[1])&&recOf(m[1]).me==='c')made(recOf(m[1]));
  else if(h==='#resume')resumeV();else if(h==='#mine')mine();else if(h==='#new')newMatch();
  else home();}
// the links inside the page (#resume, #mine, #new, # for home): one history entry each, Back returns
document.addEventListener('click',e=>{const a=e.target.closest('a[href^="#"]');if(!a)return;e.preventDefault();const h=a.getAttribute('href');
  history.pushState(null,'',h==='#'?location.pathname:h);route();scrollTo(0,0);});
addEventListener('popstate',route);
document.querySelectorAll('[data-lang]').forEach(b=>b.onclick=()=>{lang=b.dataset.lang;LS.set('games-lang',lang);texts();route();});
document.querySelectorAll('[data-copy]').forEach(b=>b.onclick=()=>{const inp=$(b.dataset.copy);inp.select();
  const ok=()=>{b.textContent=t('copied');setTimeout(()=>b.textContent=t('copy'),1500);};
  // the clipboard refused: the older way, else the link stays selected and the button says to copy it by hand
  const old=()=>{let done=false;try{done=document.execCommand('copy');}catch(e){}if(done)ok();else{inp.select();b.textContent=t('copyHand');setTimeout(()=>b.textContent=t('copy'),4000);}};
  try{navigator.clipboard.writeText(inp.value).then(ok,old);}catch(e){old();}});
texts();route();
</script>
